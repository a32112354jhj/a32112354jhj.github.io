<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演算法視覺化</title>
<style>
  :root {
    --bg:#0f1117; --sb:#161b22; --card:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --adim:#1f3a5f;
    --green:#3fb950; --orange:#f0883e; --red:#f85149; --purple:#bc8cff;
    --mono:'JetBrains Mono','Fira Code',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;height:100vh;overflow:hidden;}
  #sidebar{width:240px;min-width:240px;background:var(--sb);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
  #sidebar h1{font-size:12px;font-weight:600;color:var(--muted);padding:16px 16px 8px;letter-spacing:.08em;text-transform:uppercase}
  .cat-label{font-size:11px;font-weight:600;color:var(--muted);padding:10px 16px 4px;text-transform:uppercase;letter-spacing:.08em}
  .algo-btn{display:block;width:100%;text-align:left;padding:7px 16px 7px 24px;font-size:13px;color:var(--muted);background:none;border:none;border-left:2px solid transparent;cursor:pointer;transition:all .15s}
  .algo-btn:hover{color:var(--text);background:rgba(88,166,255,.07)}
  .algo-btn.active{color:var(--accent);border-left-color:var(--accent);background:var(--adim)}
  .algo-btn.todo{color:#3d4455;cursor:default;font-style:italic}
  .algo-btn.todo:hover{color:#3d4455;background:none}
  .algo-btn.todo .todo-tag{display:inline-block;font-size:9px;font-style:normal;padding:1px 5px;border-radius:3px;background:#1e2530;color:#4a5568;border:1px solid #2d3748;margin-left:4px;vertical-align:middle;letter-spacing:.04em}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  #header{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--sb)}
  #header h2{font-size:16px;font-weight:600}
  #header p{font-size:13px;color:var(--muted);margin-top:2px}
  #content{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;padding:18px 24px;gap:16px}
  #content>*{flex-shrink:0}
  #viz-area{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
  #viz-canvas{width:100%;display:block;border-radius:6px}
  #step-info{margin-top:10px;font-size:13px;color:var(--muted);min-height:20px;line-height:1.6}
  #step-info b{color:var(--text);font-weight:600}
  #step-info .hi{color:var(--accent)}
  #step-info .ok{color:var(--green)}
  #step-info .warn{color:var(--orange)}
  #step-info .err{color:var(--red)}
  #controls{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
  .cb{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--sb);color:var(--text);cursor:pointer;transition:all .15s}
  .cb:hover{border-color:var(--accent);color:var(--accent)}
  .cb.primary{background:var(--accent);color:#000;border-color:var(--accent)}
  .cb.primary:hover{opacity:.85}
  #speed-label{font-size:12px;color:var(--muted);margin-left:auto}
  #speed-range{accent-color:var(--accent);cursor:pointer;width:80px}
  #code-section{background:var(--card);border:1px solid var(--border);border-radius:10px}
  #code-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  #code-header span{color:var(--text);font-weight:500}
  pre{font-size:13px;font-family:var(--mono);line-height:1.7;overflow-x:auto;padding:8px 0}
  .code-line{display:block;padding:1px 16px;border-left:3px solid transparent;transition:background .2s,border-left-color .2s}
  .code-line.active{background:rgba(88,166,255,0.13);border-left-color:#58a6ff}
  .kw{color:var(--purple)}.fn{color:#79c0ff}.str{color:var(--green)}.num{color:var(--orange)}.cm{color:var(--muted);font-style:italic}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  /* ── Tips Section ── */
  #tips-section{background:var(--card);border:1px solid var(--border);border-radius:10px}
  #tips-header{padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;border-radius:10px 10px 0 0}
  #tips-header .tips-title{color:var(--text);font-weight:600;font-size:13px}
  #tips-body{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
  .tips-block{display:flex;flex-direction:column;gap:8px}
  .tips-block-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .tips-native{background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.2);border-radius:8px;padding:10px 12px;overflow:visible}
  .tips-native code{font-family:var(--mono);font-size:12px;color:#79c0ff;display:block;line-height:1.7;white-space:pre;overflow-x:auto}
  .tips-native p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
  .tips-cases{display:flex;flex-direction:column;gap:6px}
  .tips-case{display:flex;align-items:flex-start;gap:8px;background:rgba(63,185,80,.07);border:1px solid rgba(63,185,80,.15);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);line-height:1.5}
  .tips-case .tc-icon{font-size:14px;flex-shrink:0;margin-top:1px}
  .tips-none{font-size:12px;color:var(--muted);font-style:italic;padding:8px 0}
</style>
</head>

<main id="main">
  <div id="header">
    <h2 id="algo-title">請選擇一個演算法</h2>
    <p id="algo-desc">點選左側列表開始學習</p>
  </div>
  <div id="content">
    <div id="viz-area">
      <canvas id="viz-canvas" height="210"></canvas>
      <div id="step-info"></div>
    </div>
    <div id="controls">
      <button class="cb primary" id="btn-play">▶ 播放</button>
      <button class="cb" id="btn-step">▷ 下一步</button>

<script>
// ─────────────────────────────────────────────────────────────
// CONSTANTS & COLORS
// ─────────────────────────────────────────────────────────────
const CH = 210; // canvas CSS height
const C = {
  bar:'#3d4a5c', act:'#58a6ff', done:'#3fb950', pivot:'#f0883e',
  swap:'#f85149', node:'#2d3748', edge:'#30363d', eAct:'#58a6ff',
  muted:'#8b949e', text:'#e6edf3',
};

// ─────────────────────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('viz-canvas');
const ctx    = canvas.getContext('2d');
let DPR = devicePixelRatio || 1;

function resizeCanvas() {
  DPR = devicePixelRatio || 1;
  const w = canvas.offsetWidth;
  canvas.width  = w   * DPR;
  canvas.height = CH  * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function CW() { return canvas.offsetWidth || 640; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath(); ctx.fill();
}

// ─────────────────────────────────────────────────────────────
// TWEEN ENGINE
// ─────────────────────────────────────────────────────────────
let sprites  = {};   // current rendered state
let tweenRaf = null;
let tweening = false;

const lerp     = (a,b,t) => a + (b-a)*t;
const easeIO   = t => t<.5 ? 2*t*t : -1+(4-2*t)*t;

function hexToRgb(hex) {
  const h = (hex||'#3d4a5c').replace('#','');
  return [parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0];
}
function lerpColor(a,b,t) {
  if(!a||!b||a.startsWith('rgb')) return b||a||C.bar;
  try {
    const [r1,g1,b1]=hexToRgb(a), [r2,g2,b2]=hexToRgb(b);
    const h=v=>Math.max(0,Math.min(255,~~v)).toString(16).padStart(2,'0');
    return `#${h(lerp(r1,r2,t))}${h(lerp(g1,g2,t))}${h(lerp(b1,b2,t))}`;
  } catch { return b||a; }
}

function tweenTo(target, onDone) {
  cancelAnimationFrame(tweenRaf);
  tweening = true;
  const dur = getTweenDur();
  const t0  = performance.now();

  // Build "from" snapshot
  const from = {};
  for (const id in target) {
    const tg = target[id];
    if (sprites[id]) {
      from[id] = {...sprites[id]};
    } else {
      from[id] = {
        ...tg,
        x: tg._fx ?? tg.x,
        y: tg._fy ?? tg.y,
        x1: tg._fx1 ?? tg.x1, y1: tg._fy1 ?? tg.y1,
        x2: tg._fx2 ?? tg.x2, y2: tg._fy2 ?? tg.y2,
        opacity: tg._fo ?? 0,
      };
    }
  }

  // Detect arc candidates (large horizontal jump on bar/char)
  const arcH = {};
  for (const id in target) {
    const f=from[id], tg=target[id];
    if (!f) continue;
    if (tg.type==='bar'||tg.type==='char') {
      const dx = Math.abs((tg.x||0)-(f.x||0));
      if (dx > 24) arcH[id] = Math.min(52, dx*0.38);
    }
  }

  const tick = now => {
    const raw = Math.min((now-t0)/dur, 1);
    const e   = easeIO(raw);
    const cur = {};

    for (const id in target) {
      const f  = from[id];
      const tg = target[id];
      const arc = arcH[id] ? -arcH[id]*Math.sin(raw*Math.PI) : 0;
      cur[id] = {
        ...tg,
        x:  lerp(f.x ??tg.x, tg.x, e),
        y:  lerp(f.y ??tg.y, tg.y, e) + arc,
        w:  lerp(f.w ??tg.w??0, tg.w??0, e),
        h:  lerp(f.h ??tg.h??0, tg.h??0, e),
        r:  lerp(f.r ??tg.r??20, tg.r??20, e),
        x1: tg.x1!=null ? lerp(f.x1??tg.x1, tg.x1, e) : undefined,
        y1: tg.y1!=null ? lerp(f.y1??tg.y1, tg.y1, e) : undefined,
        x2: tg.x2!=null ? lerp(f.x2??tg.x2, tg.x2, e) : undefined,
        y2: tg.y2!=null ? lerp(f.y2??tg.y2, tg.y2, e) : undefined,
        opacity: lerp(f.opacity??1, tg.opacity??1, e),
        color:   lerpColor(f.color, tg.color, e),
      };
    }
    drawSprites(cur);

    if (raw < 1) {
      tweenRaf = requestAnimationFrame(tick);
    } else {
      sprites = {};
      for (const id in target) {
        const s={...target[id]};
        delete s._fx; delete s._fy; delete s._fo;
        delete s._fx1; delete s._fy1; delete s._fx2; delete s._fy2;
        sprites[id]=s;
      }
      tweening = false;
      onDone?.();
    }
  };
  tweenRaf = requestAnimationFrame(tick);
}

function snapTo(target) {
  cancelAnimationFrame(tweenRaf);
  tweening = false;
  sprites = {};
  for (const id in target) {
    const s={...target[id]};
    delete s._fx; delete s._fy; delete s._fo;
    sprites[id]=s;
  }
  drawSprites(sprites);
}

// ─────────────────────────────────────────────────────────────
// SPRITE RENDERER
// ─────────────────────────────────────────────────────────────
function drawSprites(spr) {
  ctx.clearRect(0,0,CW(),CH);
  const sorted = Object.entries(spr).sort((a,b)=>(a[1].z||0)-(b[1].z||0));
  for (const [,s] of sorted) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, s.opacity??1));

    if (s.type==='bar') {
      ctx.fillStyle = s.color||C.bar;
      roundRect(s.x, s.y, s.w, s.h, 3);
      ctx.fillStyle = C.text;
      ctx.font = `bold ${Math.min(13,Math.max(8,s.w-4))}px sans-serif`;
      ctx.textAlign='center';
      ctx.fillText(s.text??'', s.x+s.w/2, s.y+s.h+13);
      if (s.top) {
        ctx.fillStyle=C.muted; ctx.font='10px sans-serif';
        ctx.fillText(s.top, s.x+s.w/2, s.y-5);
      }
    }
    else if (s.type==='char') {
      const sz=s.w||36;
      ctx.fillStyle=s.color||C.bar;
      roundRect(s.x, s.y, sz, sz, 5);
      ctx.fillStyle=C.text; ctx.font=`bold ${s.fs||15}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(s.text??'', s.x+sz/2, s.y+sz/2);
      ctx.textBaseline='alphabetic';
      if (s.bot) {
        ctx.fillStyle=C.muted; ctx.font='10px sans-serif'; ctx.textAlign='center';
        ctx.textBaseline='alphabetic';
        ctx.fillText(s.bot, s.x+sz/2, s.y+sz+13);
      }
    }
    else if (s.type==='circle') {
      ctx.fillStyle=s.color||C.node;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r||20,0,Math.PI*2); ctx.fill();
      if (s.stroke) { ctx.strokeStyle=s.stroke; ctx.lineWidth=2; ctx.stroke(); }
      ctx.fillStyle=C.text; ctx.font=`bold ${s.fs||13}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(s.text??'', s.x, s.y);
      ctx.textBaseline='alphabetic';
      if (s.bot) {
        ctx.fillStyle=C.muted; ctx.font='11px sans-serif'; ctx.textAlign='center';
        ctx.fillText(s.bot, s.x, s.y+(s.r||20)+14);
      }
    }
    else if (s.type==='edge') {
      ctx.strokeStyle=s.color||C.edge;
      ctx.lineWidth=s.lw||1.5;
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    }
    else if (s.type==='arrow') {
      ctx.strokeStyle=s.color||C.muted; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x2,s.y2??s.y); ctx.stroke();
      const ang=Math.atan2((s.y2??s.y)-s.y, s.x2-s.x);
      ctx.fillStyle=s.color||C.muted;
      ctx.beginPath();
      ctx.moveTo(s.x2, s.y2??s.y);
      ctx.lineTo(s.x2-9*Math.cos(ang-0.4), (s.y2??s.y)-9*Math.sin(ang-0.4));
      ctx.lineTo(s.x2-9*Math.cos(ang+0.4), (s.y2??s.y)-9*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fill();
    }
    else if (s.type==='rect') {
      ctx.fillStyle=s.color||C.node;
      roundRect(s.x,s.y,s.w,s.h,s.r||4);
      if (s.text!=null) {
        ctx.fillStyle=s.tc||C.text; ctx.font=s.font||'bold 13px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(s.text, s.x+s.w/2, s.y+s.h/2);
        ctx.textBaseline='alphabetic';
      }
    }
    else if (s.type==='label') {
      ctx.fillStyle=s.color||C.muted;
      ctx.font=s.font||'12px sans-serif';
      ctx.textAlign=s.align||'left';
      ctx.fillText(s.text??'', s.x, s.y);
    }
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────
// PLAYBACK
// ─────────────────────────────────────────────────────────────
let steps=[], stepIdx=0, playing=false, currentAlgo=null;

function getTweenDur() {
  return [700,400,220,100,40][parseInt(document.getElementById('speed-range').value)-1];
}
function setInfo(t){ document.getElementById('step-info').innerHTML=t; }
function highlightLine(n){
  document.querySelectorAll('.code-line').forEach(el=>el.classList.remove('active'));
  if(n==null) return;
  const ns=Array.isArray(n)?n:[n];
  ns.forEach(ln=>{
    const el=document.querySelector(`.code-line[data-line="${ln}"]`);
    if(el){ el.classList.add('active'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  });
}
function showStep(s){
  if(!s) return;
  setInfo(s.info||'');
  highlightLine(s.line??null);
}

function advance() {
  if (stepIdx >= steps.length-1) { stopPlay(); return; }
  stepIdx++;
  const s=steps[stepIdx];
  tweenTo(s.sprites, () => {
    showStep(s);
    if (playing) advance();
  });
  showStep(s);
}

function startPlay(){
  if (stepIdx>=steps.length-1) { stepIdx=0; snapTo(steps[0].sprites); setInfo(steps[0].info||''); }
  playing=true;
  document.getElementById('btn-play').textContent='⏸ 暫停';
  document.getElementById('btn-play').className='cb';
  advance();
}
function stopPlay(){
  playing=false;
  document.getElementById('btn-play').textContent='▶ 播放';
  document.getElementById('btn-play').className='cb primary';
}

document.getElementById('btn-play').addEventListener('click',()=>{
  if(!currentAlgo) return;
  playing ? stopPlay() : startPlay();
});
document.getElementById('btn-step').addEventListener('click',()=>{
  if(!currentAlgo) return;
  stopPlay();
  if(stepIdx<steps.length-1){
    stepIdx++;
    const s=steps[stepIdx];
    tweenTo(s.sprites,()=>showStep(s));
    showStep(s);
  }
});
document.getElementById('btn-reset').addEventListener('click',()=>{
  stopPlay(); stepIdx=0;
  if(steps.length){ snapTo(steps[0].sprites); showStep(steps[0]); }
});

document.querySelectorAll('.algo-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.algo-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    loadAlgo(btn.dataset.algo);
  });
});

  if (!tips) { el.innerHTML = '<p style="padding:14px 16px;font-size:12px;color:var(--muted)">暫無說明</p>'; return; }

  // HTML-escape raw code text so < > & render correctly inside <code>
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Left block: JS native / best approach
  const nativeHtml = tips.native
    ? `<div class="tips-native"><code>${esc(tips.native.code)}</code><p>${tips.native.note}</p></div>`
    : `<div class="tips-none">此演算法無對應的 JS 內建方法，需自行實作。</div>`;

  // Right block: use cases
  const icons = ['🛒','📱','🗺️','🔍','💾','⚡','🔐','📊','🌐','🎵','🗂️','🏦','📬','🔄'];

function loadAlgo(name) {

  document.getElementById('algo-desc').textContent=def.desc;

// ─────────────────────────────────────────────────────────────
// BAR LAYOUT HELPER
// ─────────────────────────────────────────────────────────────
function barLayout(n) {
  const pad=16, gap=4, w=CW();
  const bw=(w-pad*2-gap*(n-1))/n;
  const maxH=150;
  return {pad,gap,bw,maxH};
}

// items = [{id,value},...], positions track identity through swaps
function makeBars(items, opts={}) {
  // opts: active:Set, done:Set, swap:Set, pivot:id, top:{}
  const n=items.length;
  const maxV=Math.max(...items.map(it=>it.value));
  const {pad,gap,bw,maxH}=barLayout(n);
  const spr={};
  items.forEach((it,i)=>{
    const h=Math.max(8,(it.value/maxV)*maxH);
    const x=pad+i*(bw+gap);
    const y=CH-h-28;
    let color=C.bar;
    if(opts.done?.has(it.id))   color=C.done;
    if(opts.active?.has(it.id)) color=C.act;
    if(opts.swap?.has(it.id))   color=C.swap;
    if(opts.pivot===it.id)      color=C.pivot;
    spr[it.id]={type:'bar',x,y,w:bw,h,color,text:String(it.value),z:1,top:opts.top?.[it.id]};
  });
  return spr;
}

}

ALGOS.insertion={
  title:'插入排序 Insertion Sort',
  desc:'像整理手中的撲克牌：每次摸到一張新牌，往左逐一比較找到正確位置插入。左側始終保持有序狀態。資料量小或「幾乎已排序」時，實際效能優於很多演算法。時間複雜度 O(n²)，最優 O(n)。',
  buildSteps(){
    const vals=[12,11,13,5,6,9];
    const items=vals.map((v,i)=>({id:`i${i}`,value:v}));
    const n=items.length;
    const st=[];
    const push=(arr,opts,info,line)=>st.push({sprites:makeBars(arr,opts),info,line});
    const a=[...items];
    push(a,{done:new Set([a[0].id])},`<b class="ok">綠色</b> = 已排序區　<b class="hi">藍色</b> = 正在插入的數　<b class="err">紅色</b> = 正在右移讓位的數`);
    for(let i=1;i<n;i++){
      const key=a[i];
      push(a,{active:new Set([key.id]),done:new Set(a.slice(0,i).map(it=>it.id))},
        `取出 <b>${key.value}</b>（藍色），往已排序區 [${a.slice(0,i).map(it=>it.value)}] 中找插入位置`, 3);
      let j=i-1;
      while(j>=0&&a[j].value>key.value){
        a[j+1]=a[j]; j--;
        const snap=[...a]; snap[j+1]=key;
        push(snap,{active:new Set([key.id]),swap:new Set([a[j+1].id]),done:new Set(snap.slice(0,j+1).map(it=>it.id))},
          `<b>${a[j+1].value}</b> > <b>${key.value}</b>，往右移一格，為 <b>${key.value}</b> 讓出空位`, [5,6]);
      }
      a[j+1]=key;
      push(a,{done:new Set(a.slice(0,i+1).map(it=>it.id))},
        `<b>${key.value}</b> 插入位置 ${j+1}　已排序區擴展為 <b>[${a.slice(0,i+1).map(it=>it.value)}]</b>`, 8);
    }
    push(a,{done:new Set(a.map(it=>it.id))},`<span class="ok">✅ 排序完成！</span> 結果：<b>[${a.map(it=>it.value)}]</b>`, 10);

  },
  code:`<span class="kw">function</span> <span class="fn">insertionSort</span>(arr) {
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">1</span>; i < arr.length; i++) {
    <span class="kw">const</span> key = arr[i];
    <span class="kw">let</span> j = i - <span class="num">1</span>;
    <span class="kw">while</span> (j >= <span class="num">0</span> && arr[j] > key) {
      arr[j + <span class="num">1</span>] = arr[j]; j--;
    }
    arr[j + <span class="num">1</span>] = key;
  }
  <span class="kw">return</span> arr;
}`,
  tips:{

ALGOS.merge={
  title:'合併排序 Merge Sort',
  desc:'分治策略：不斷把陣列「切半」直到只剩 1 個元素（1 個元素自然有序），再把兩個有序子陣列「合併」成更大的有序陣列。藍色 = 左半，深色 = 右半，綠色 = 合併完成。最穩定的 O(n log n)，但需要額外記憶體空間。',
  buildSteps(){
    const vals=[38,27,43,3,9,82,10];
    const n=vals.length;
    const st=[];

    function makeSegSprites(arr, regions) {
      // regions: [{start,len,color}]
      const maxV=Math.max(...arr);
      const {pad,gap,bw,maxH}=barLayout(n);
      const spr={};
      arr.forEach((v,i)=>{
        const h=Math.max(8,(v/maxV)*maxH);
        const x=pad+i*(bw+gap), y=CH-h-28;
        let color=C.bar;
        for(const reg of regions) {
          if(i>=reg.start&&i<reg.start+reg.len) color=reg.color;
        }
        spr[`m${i}`]={type:'bar',x,y,w:bw,h,color,text:String(v),z:1};
      });
      return spr;
    }

    st.push({sprites:makeSegSprites(vals,[]),info:`初始陣列 <b>[${vals}]</b>，分治思路：先切到最小單位，再一層層合併回來`});

    function mergeSort(arr,start){
      if(arr.length<=1) return arr;
      const mid=Math.floor(arr.length/2);
      const L=arr.slice(0,mid), R=arr.slice(mid);
      st.push({sprites:makeSegSprites(
        [...vals.slice(0,start),...arr,...vals.slice(start+arr.length)],
        [{start,len:mid,color:'#1f3a5f'},{start:start+mid,len:R.length,color:'#2a3a2a'}]
      ),info:`從中間切開 <b>[${arr}]</b>　→　左半 <b>[${L}]</b>（藍）　右半 <b>[${R}]</b>（深綠）`, line:3});
      const sL=mergeSort(L,start);
      const sR=mergeSort(R,start+mid);
      const merged=[];
      let i=0,j=0;
      while(i<sL.length&&j<sR.length){ merged.push(sL[i]<=sR[j]?sL[i++]:sR[j++]); }
      while(i<sL.length) merged.push(sL[i++]);
      while(j<sR.length) merged.push(sR[j++]);
      const full=[...vals.slice(0,start),...merged,...vals.slice(start+merged.length)];
      // mutate vals for display
      for(let k=0;k<merged.length;k++) vals[start+k]=merged[k];
      st.push({sprites:makeSegSprites(vals,[{start,len:merged.length,color:C.done}]),
        info:`合併兩個有序子陣列：<b>[${sL}]</b> + <b>[${sR}]</b>　→　逐一取較小的放入　→　<span class="ok"><b>[${merged}]</b></span>`, line:[10,11]});
      return merged;
    }
    mergeSort([...vals],0);
    st.push({sprites:makeSegSprites(vals,[{start:0,len:n,color:C.done}]),
      info:`<span class="ok">✅ 排序完成！</span> 結果：<b>[${vals}]</b>`, line:6});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">mergeSort</span>(arr) {
  <span class="kw">if</span> (arr.length <= <span class="num">1</span>) <span class="kw">return</span> arr;
  <span class="kw">const</span> mid   = Math.floor(arr.length / <span class="num">2</span>);
  <span class="kw">const</span> left  = <span class="fn">mergeSort</span>(arr.slice(<span class="num">0</span>, mid));
  <span class="kw">const</span> right = <span class="fn">mergeSort</span>(arr.slice(mid));
  <span class="kw">return</span> <span class="fn">merge</span>(left, right);
}
<span class="kw">function</span> <span class="fn">merge</span>(L, R) {
  <span class="kw">const</span> res = []; <span class="kw">let</span> i=<span class="num">0</span>, j=<span class="num">0</span>;
  <span class="kw">while</span>(i&lt;L.length&&j&lt;R.length)
    res.push(L[i]<=R[j] ? L[i++] : R[j++]);
  <span class="kw">return</span> [...res, ...L.slice(i), ...R.slice(j)];
}`,
  tips:{
    native:{
      code:`[38,27,43,3,9,82,10].sort((a, b) => a - b);
// V8 引擎對大陣列使用 TimSort（合併排序的變體）`,
      note:`合併排序是<b>穩定排序</b>（相同值保持原始順序）。特別適合<b>外部排序</b>：資料大到無法全載入記憶體時，分批讀取、排序、再合併。`
    },
    cases:[
      '外部排序：資料量超過記憶體限制，需分批排序再合併',
      '穩定排序需求：相同值要保持原始順序（如排序姓名再按年齡）',
      '合併兩個已排序的清單（如資料庫 JOIN 操作）',
      '鏈結串列排序：不需隨機存取，合併排序特別適合'
    ]
  }
};

// ══ QUICK SORT ═══════════════════════════════════════════════
ALGOS.quick={
  title:'快速排序 Quick Sort',
  desc:'選一個「基準值 pivot」（橘色），把比它小的全移到左邊、比它大的移到右邊，pivot 就確定了最終位置。再對左右兩側各自遞迴。實際速度很快，是業界最常用的排序演算法。平均時間複雜度 O(n log n)。',
  buildSteps(){
    const vals=[10,7,8,9,1,5];
    const items=vals.map((v,i)=>({id:`q${i}`,value:v}));
    const n=items.length;
    const st=[];
    const push=(arr,opts,info,line)=>st.push({sprites:makeBars(arr,opts),info,line});
    const a=[...items];
    push(a,{},'<b class="warn">橘色</b> = pivot 基準值，<b class="hi">藍色</b> = 正在掃描，<b class="err">紅色</b> = 交換中，<b class="ok">綠色</b> = 已確定位置');

    function partition(arr,lo,hi){
      const piv=arr[hi];
      let i=lo-1;
      push(arr,{pivot:arr[hi].id,done:new Set()},`選取 <b class="warn">pivot = ${piv.value}</b>（橘色），準備把比它小的都移到左邊`, 10);
      for(let j=lo;j<hi;j++){
        const isSmall=arr[j].value<=piv.value;
        push(arr,{pivot:arr[hi].id,active:new Set([arr[j].id])},
          `掃描 <b>${arr[j].value}</b> vs pivot <b>${piv.value}</b>　→　${isSmall?`<span class="ok">${arr[j].value} ≤ pivot，移到左側</span>`:`${arr[j].value} > pivot，留在右側`}`, [11,12]);
        if(isSmall){
          i++;
          [arr[i],arr[j]]=[arr[j],arr[i]];
          push(arr,{pivot:arr[hi].id,swap:new Set([arr[i].id,arr[j].id])},
            `🔄 交換到左側區域，左側目前：[${arr.slice(lo,i+1).map(it=>it.value)}]`, 12);
        }
      }
      [arr[i+1],arr[hi]]=[arr[hi],arr[i+1]];
      push(arr,{done:new Set([arr[i+1].id])},
        `<span class="ok">pivot <b>${piv.value}</b> 確定落位</span>（位置 ${i+1}），左側全 ≤ ${piv.value}，右側全 > ${piv.value}`, 14);
      return i+1;
    }
    function qs(arr,lo,hi){
      if(lo<hi){ const pi=partition(arr,lo,hi); qs(arr,lo,pi-1); qs(arr,pi+1,hi); }
    }
    qs(a,0,n-1);
    push(a,{done:new Set(a.map(it=>it.id))},`<span class="ok">✅ 排序完成！</span> 結果：<b>[${a.map(it=>it.value)}]</b>`, 7);
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">quickSort</span>(arr, lo=<span class="num">0</span>, hi=arr.length-<span class="num">1</span>) {
  <span class="kw">if</span> (lo < hi) {
    <span class="kw">const</span> pi = <span class="fn">partition</span>(arr, lo, hi);
    <span class="fn">quickSort</span>(arr, lo, pi-<span class="num">1</span>);
    <span class="fn">quickSort</span>(arr, pi+<span class="num">1</span>, hi);
  }
  <span class="kw">return</span> arr;
}
<span class="kw">function</span> <span class="fn">partition</span>(arr, lo, hi) {
  <span class="kw">const</span> pivot = arr[hi]; <span class="kw">let</span> i = lo - <span class="num">1</span>;
  <span class="kw">for</span> (<span class="kw">let</span> j=lo; j<hi; j++) {
    <span class="kw">if</span> (arr[j] <= pivot) { i++; [arr[i],arr[j]]=[arr[j],arr[i]]; }
  }
  [arr[i+<span class="num">1</span>],arr[hi]]=[arr[hi],arr[i+<span class="num">1</span>]]; <span class="kw">return</span> i+<span class="num">1</span>;
}`,
  tips:{
    native:{
      code:`[3,6,8,10,1,2,1].sort((a, b) => a - b);
// V8 小陣列使用快速排序，大陣列使用 TimSort`,
      note:`快速排序平均最快（cache 友善、in-place），但最差 O(n²)（pivot 每次都選到最大/最小值）。實務上用<b>隨機化 pivot</b> 或 <b>三數取中</b> 可大幅降低最差情況發生機率。`
    },
    cases:[
      '一般用途排序的首選：C++ STL、Java Arrays.sort() 的底層',
      '記憶體有限場景：in-place 排序，空間複雜度 O(log n)',
      '資料庫索引建立：大量數值資料的快速排序',
      '電競遊戲排行榜：即時更新分數排序'
    ]
  }
};

// ══ LINEAR SEARCH ════════════════════════════════════════════
ALGOS.linear={
  title:'循序搜尋 Linear Search',
  desc:'最直接的搜尋方式：從第一個元素開始，逐一比對是否等於目標值，找到立刻回傳索引。無需排序，適合任何陣列。缺點是最壞情況需比對所有元素。時間複雜度 O(n)。',
  buildSteps(){
    const vals=[4,2,7,1,9,5,3,8];
    const items=vals.map((v,i)=>({id:`l${i}`,value:v}));
    const target=9;
    const n=items.length;
    const st=[];
    const push=(arr,opts,info,line)=>st.push({sprites:makeBars(arr,opts),info,line});
    push(items,{},`目標：找 <b>${target}</b>。從 arr[0] 開始，一格一格往右比對（暗色 = 已跳過）`);
    const scanned=new Set();
    for(let i=0;i<n;i++){
      const hit=vals[i]===target;
      push(items,{active:new Set([items[i].id]),done:scanned},
        `arr[${i}] = <b>${vals[i]}</b>　→　${hit?`<span class="ok">🎯 就是目標 ${target}！</span>`:`${vals[i]} ≠ ${target}，跳過繼續往右`}`, 3);
      if(hit){
        const spr=makeBars(items,{});
        for(const id in spr) spr[id].color='#252d3a';
        spr[items[i].id].color=C.done;
        st.push({sprites:spr,info:`<span class="ok">✅ 在索引 ${i} 找到 <b>${target}</b>！</span> 共比對了 <b>${i+1}</b> 次`, line:3});
        return st;
      }
      scanned.add(items[i].id);
    }
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">linearSearch</span>(arr, target) {
  <span class="kw">for</span> (<span class="kw">let</span> i=<span class="num">0</span>; i<arr.length; i++) {
    <span class="kw">if</span> (arr[i]===target) <span class="kw">return</span> i;
  }
  <span class="kw">return</span> -<span class="num">1</span>;
}
<span class="fn">linearSearch</span>([<span class="num">4</span>,<span class="num">2</span>,<span class="num">7</span>,<span class="num">1</span>,<span class="num">9</span>], <span class="num">9</span>); <span class="cm">// → 4</span>`,
  tips:{
    native:{
      code:`const arr = [4, 2, 7, 1, 9];
arr.find(x => x === 9);      // → 9 (回傳元素值)
arr.findIndex(x => x === 9); // → 4 (回傳索引)
arr.indexOf(9);              // → 4 (嚴格相等)
arr.includes(9);             // → true (是否存在)`,
      note:`JS 內建方法都是 O(n) 線性掃描，與手寫相同效率。<code>find/findIndex</code> 支援自定義條件；<code>indexOf/includes</code> 使用嚴格相等（===）。`
    },
    cases:[
      '未排序資料的單次查找：唯一選擇',
      '小型陣列搜尋（< 50 筆）：簡單直接，無需預處理',
      '條件複雜的搜尋：如找第一個偶數、第一個滿足條件的物件',
      '字串中找特定字元：str.indexOf() 底層也是線性搜尋'
    ]
  }
};

// ══ BINARY SEARCH ════════════════════════════════════════════
ALGOS.binary={
  title:'二分搜尋 Binary Search',
  desc:'每次取「中間點」和目標比較，若目標較大則搜右半，較小則搜左半，每輪搜尋範圍砍半。10 個元素最多 4 次，100 萬個最多 20 次！效率遠勝循序搜尋。前提：陣列必須已排序。時間複雜度 O(log n)。',
  buildSteps(){
    const vals=[2,5,8,12,16,23,38,56,72,91];
    const items=vals.map((v,i)=>({id:`bs${i}`,value:v}));
    const target=23;
    const n=items.length;
    const st=[];
    const makeB=(lo,hi,mid,found)=>{
      const spr=makeBars(items,{});
      items.forEach((it,i)=>{
        if(i<lo||i>hi) spr[it.id].color='#252d3a';
        else if(i===mid) spr[it.id].color=found?C.done:C.act;
        else spr[it.id].color=C.pivot;
      });
      return spr;
    };
    st.push({sprites:makeB(0,n-1,-1,false),info:`共 ${n} 個已排序數，找 <b>${target}</b>。<b class="warn">橘色</b> = 搜尋範圍，<b class="hi">藍色</b> = 中間點，暗色 = 已排除`});
    let lo=0,hi=n-1,round=0;
    while(lo<=hi){
      round++;
      const mid=~~((lo+hi)/2);
      st.push({sprites:makeB(lo,hi,mid,false),info:`第 ${round} 次：範圍 [${lo}..${hi}]，中間點 arr[${mid}] = <b>${vals[mid]}</b>`, line:4});
      if(vals[mid]===target){
        st.push({sprites:makeB(lo,hi,mid,true),info:`<span class="ok">✅ 找到！arr[${mid}] = <b>${target}</b>，只花了 <b>${round}</b> 次比較（循序搜尋最多要 ${n} 次）</span>`, line:5});
        return st;
      } else if(vals[mid]<target){
        st.push({sprites:makeB(lo,hi,mid,false),info:`${vals[mid]} < ${target}　→　目標在右半，<b>排除左側 ${mid-lo+1} 個數</b>`, line:6});
        lo=mid+1;
      } else {
        st.push({sprites:makeB(lo,hi,mid,false),info:`${vals[mid]} > ${target}　→　目標在左半，<b>排除右側 ${hi-mid+1} 個數</b>`, line:7});
        hi=mid-1;
      }
    }
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">binarySearch</span>(arr, target) {
  <span class="kw">let</span> lo=<span class="num">0</span>, hi=arr.length-<span class="num">1</span>;
  <span class="kw">while</span>(lo<=hi){
    <span class="kw">const</span> mid = ~~((lo+hi)/<span class="num">2</span>);
    <span class="kw">if</span>      (arr[mid]===target) <span class="kw">return</span> mid;
    <span class="kw">else if</span> (arr[mid]<target)  lo=mid+<span class="num">1</span>;
    <span class="kw">else</span>                        hi=mid-<span class="num">1</span>;
  }
  <span class="kw">return</span> -<span class="num">1</span>;
}`,
  tips:{
    native:{
      code:`// JS 沒有內建二分搜尋，但可用 lodash：
_.sortedIndex([1,3,5,7,9], 5); // → 2

// 或自行封裝成通用版：
const bisect = (arr, t) => {
  let lo=0, hi=arr.length-1;
  while(lo<=hi){const m=lo+hi>>1; arr[m]&lt;t?lo=m+1:hi=m-1;}
  return lo;
};`,
      note:`二分搜尋的前提：<b>陣列必須已排序</b>。若需重複搜尋同一陣列，先排序 O(n log n)，之後每次搜尋只需 O(log n)，長期下來大幅節省時間。`
    },
    cases:[
      '字典 / 詞典查詢：已排序的大量詞彙中快速定位',
      '資料庫索引：B-Tree 索引的核心就是二分搜尋思想',
      'Git bisect：在提交歷史中二分搜尋引入 bug 的版本',
      '遊戲中的碰撞偵測：在已排序的邊界值中快速定位區間'
    ]
  }
};

// ══ FIBONACCI ════════════════════════════════════════════════
ALGOS.fibonacci={
  title:'費波那契 Fibonacci',
  desc:'F(0)=0, F(1)=1，之後每個數都是前兩個的加總（F(n) = F(n-1) + F(n-2)）。自然界中隨處可見：花瓣數、螺旋殼、黃金比例。遞迴寫法直覺優雅，但會大量重複計算同一個子問題（見下一題）。時間複雜度 O(2ⁿ)。',
  buildSteps(){
    const st=[];
    const results=[];
    const n=8;
    const makeFibSpr=(vals,hiIdx)=>{
      const spr={};
      const N=8, gap=4, pad=10;
      const bw=Math.floor((CW()-pad*2-gap*(N-1))/N);
      const BASE_Y=CH-20; // bottom of bars
      const LABEL_Y=CH-8; // F(n) label row
      vals.forEach((v,i)=>{
        if(v==null) return;
        const maxV=Math.max(...vals.filter(x=>x!=null),1);
        const h=Math.max(12,(v/maxV)*130);
        const x=pad+i*(bw+gap);
        const barY=BASE_Y-h;
        spr[`f${i}`]={
          type:'bar',
          x, y:barY, w:bw, h,
          color: i===hiIdx?C.act:C.done,
          text:'', z:1,          // 不在 bar 裡放文字
          _fx:x, _fy:BASE_Y, _fo:0
        };
        // 數值顯示在 bar 上方
        spr[`fv${i}`]={type:'label',x:x+bw/2,y:barY-4,
          text:String(v),color:i===hiIdx?C.act:C.done,
          font:'bold 11px sans-serif',align:'center',z:3};
        // F(n) 標籤在最底部
        spr[`fl${i}`]={type:'label',x:x+bw/2,y:LABEL_Y,
          text:`F(${i})`,color:C.muted,font:'10px sans-serif',align:'center',z:2};
      });
      return spr;
    };
    st.push({sprites:{},info:'逐步計算 F(0) 到 F(7)，每個新結果（藍色）都由前兩個加總而來'});
    function fib(k){
      if(k<=1){ results[k]=k; st.push({sprites:makeFibSpr([...results],k),info:`F(${k}) = <b>${k}</b>　（基本情況，直接定義，不再往下遞迴）`, line:3}); return k; }
      const a=fib(k-1), b=results[k-2]??fib(k-2);
      results[k]=a+b;
      st.push({sprites:makeFibSpr([...results],k),info:`F(${k}) = F(${k-1}) + F(${k-2}) = <b>${a}</b> + <b>${b}</b> = <b class="hi">${a+b}</b>`, line:4});
      return a+b;
    }
    for(let i=0;i<n;i++) if(results[i]==null) fib(i);
    st.push({sprites:makeFibSpr([...results],-1),info:`<span class="ok">✅ 數列完成：<b>[${results.slice(0,n)}]</b></span>　注意：純遞迴計算 F(7) 需要 <b>呼叫遞迴約 25 次</b>`});
    return st;
  },
  code:`<span class="cm">// 遞迴版 O(2ⁿ) — 有大量重複計算</span>
<span class="kw">function</span> <span class="fn">fib</span>(n) {
  <span class="kw">if</span> (n <= <span class="num">1</span>) <span class="kw">return</span> n;
  <span class="kw">return</span> <span class="fn">fib</span>(n-<span class="num">1</span>) + <span class="fn">fib</span>(n-<span class="num">2</span>);
}
<span class="cm">// [0,1,2,3,4,5,6,7].map(fib) → [0,1,1,2,3,5,8,13]</span>`,
  tips:{
    native:{
      code:`// 最佳：迭代版 DP，時間 O(n)，空間 O(1)
function fib(n) {
  let [a, b] = [0, 1];
  for (let i = 0; i < n; i++) [a, b] = [b, a + b];
  return a;
}
fib(40); // → 102334155`,
      note:`純遞迴 fib(n) 時間複雜度爆炸到 O(2ⁿ)。<b>迭代版</b>只用兩個變數，時間 O(n)、空間 O(1)，是實際開發的首選。記憶化遞迴空間仍是 O(n)。`
    },
    cases:[
      '技術分析：費波那契回撤（38.2%、61.8%）用於股票/外匯支撐阻力位',
      '自然界模型：植物葉序、鸚鵡螺殼的數學模型',
      '動態規劃入門：理解記憶化是 DP 的基礎概念',
      '演算法面試：最常考的遞迴 → DP 轉化題型'
    ]
  }
};

// ══ MEMOIZED FIB ═════════════════════════════════════════════
ALGOS.memoFib={
  title:'記憶化 Memoized Fibonacci',
  desc:'解決遞迴 Fibonacci 重複計算的核心技巧：把已算出的結果存入快取表（cache）。再次需要同一個值時，直接讀取而不重算。這是「動態規劃」的思想精髓，讓時間複雜度從 O(2ⁿ) 降到 O(n)。',
  buildSteps(){
    const st=[];
    const cache={};
    const makeS=(vals,hiIdx,hitIdx)=>{
      const spr={};
      const N=9, gap=3, pad=8;
      const bw=Math.floor((CW()-pad*2-gap*(N-1))/N);
      const BASE_Y=CH-26; // bar 底端：留空間給兩行標籤
      const LABEL1_Y=CH-14; // F(n) 行
      const LABEL2_Y=CH-4;  // 快取/命中 行
      vals.forEach((v,i)=>{
        if(v==null) return;
        const maxV=Math.max(...vals.filter(x=>x!=null),1);
        const h=Math.max(12,(v/maxV)*118);
        const x=pad+i*(bw+gap);
        const barY=BASE_Y-h;
        const col=i===hitIdx?C.pivot:i===hiIdx?C.act:C.done;
        spr[`mf${i}`]={
          type:'bar', x, y:barY, w:bw, h,
          color:col, text:'', z:1, _fx:x, _fy:BASE_Y, _fo:0
        };
        // 數值在 bar 上方
        spr[`mfv${i}`]={type:'label',x:x+bw/2,y:barY-4,
          text:String(v),color:col,font:'bold 10px sans-serif',align:'center',z:3};
        // F(n) 標籤
        spr[`mfl${i}`]={type:'label',x:x+bw/2,y:LABEL1_Y,
          text:`F(${i})`,color:C.muted,font:'9px sans-serif',align:'center',z:2};
        // 快取/命中 標籤
        spr[`mft${i}`]={type:'label',x:x+bw/2,y:LABEL2_Y,
          text:i===hitIdx?'命中':'快取',color:i===hitIdx?C.pivot:C.muted,
          font:'9px sans-serif',align:'center',z:2};
      });
      return spr;
    };
    const vals=new Array(9).fill(null);
    st.push({sprites:{},info:'快取表初始為空，開始計算 F(8)。<b class="warn">橘色</b> = 快取命中（直接讀取，省去整棵子樹的計算）'});
    function mfib(k){
      if(k in cache){
        st.push({sprites:makeS([...vals],k,k),info:`⚡ <b class="warn">快取命中！</b>F(${k}) = <b>${cache[k]}</b>，直接取用，省去重複計算`, line:2});
        return cache[k];
      }
      if(k<=1){ cache[k]=k; vals[k]=k; st.push({sprites:makeS([...vals],k,-1),info:`F(${k}) = <b>${k}</b>（基本情況）→ 存入快取備用`, line:3}); return k; }
      const a=mfib(k-1), b=mfib(k-2);
      cache[k]=a+b; vals[k]=a+b;
      st.push({sprites:makeS([...vals],k,-1),info:`F(${k}) = ${a} + ${b} = <b class="hi">${a+b}</b>　→ 計算完成，<b>存入快取</b>以備後用`, line:4});
      return a+b;
    }
    mfib(8);
    st.push({sprites:makeS([...vals],-1,-1),info:`<span class="ok">✅ 完成！</span>純遞迴需呼叫 <b>數百次</b>，記憶化只需 <b>9 次</b>　——　快取讓效率提升數十倍`});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">memoFib</span>(n, cache={}) {
  <span class="kw">if</span> (n <span class="kw">in</span> cache) <span class="kw">return</span> cache[n]; <span class="cm">// 快取命中！</span>
  <span class="kw">if</span> (n<=<span class="num">1</span>) <span class="kw">return</span> (cache[n]=n);
  <span class="kw">return</span> cache[n] = <span class="fn">memoFib</span>(n-<span class="num">1</span>,cache) + <span class="fn">memoFib</span>(n-<span class="num">2</span>,cache);
}
<span class="fn">memoFib</span>(<span class="num">40</span>); <span class="cm">// → 102334155（瞬間完成）</span>`,
  tips:{
    native:{
      code:`// 迭代 DP：最省空間，O(n) 時間，O(1) 空間
function fib(n) {
  let [a, b] = [0, 1];
  for (let i = 0; i < n; i++) [a, b] = [b, a + b];

ALGOS.queue={

  code:`<span class="kw">class</span> <span class="fn">Queue</span> {
  <span class="fn">constructor</span>() { <span class="kw">this</span>.items=[]; }
  <span class="fn">enqueue</span>(x) { <span class="kw">this</span>.items.push(x); }
  <span class="fn">dequeue</span>()  { <span class="kw">return</span> <span class="kw">this</span>.items.shift(); }
  <span class="fn">front</span>()    { <span class="kw">return</span> <span class="kw">this</span>.items[<span class="num">0</span>]; }
}
<span class="kw">const</span> q=<span class="kw">new</span> <span class="fn">Queue</span>();
q.<span class="fn">enqueue</span>(<span class="str">'A'</span>); q.<span class="fn">enqueue</span>(<span class="str">'B'</span>);
q.<span class="fn">dequeue</span>(); <span class="cm">// → 'A'</span>`,
  tips:{

      code:`// 小量資料：Array 就夠了（shift 是 O(n)，量小時可接受）

queue.push('B');    // 入列 → ['A','B']
queue.shift();      // 出列 → 'A'，剩 ['B']

      note:`<code>Array.shift()</code> 是 O(n)（需移動所有元素），大量操作會慢。生產環境大佇列建議用 <b>Map + 頭尾指標</b>（O(1) 出列）或鏈結串列實作。`

  code:`<span class="kw">class</span> <span class="fn">Node</span> { <span class="fn">constructor</span>(v){<span class="kw">this</span>.val=v;<span class="kw">this</span>.next=<span class="kw">null</span>;} }
<span class="kw">class</span> <span class="fn">LinkedList</span> {

    <span class="kw">const</span> node=<span class="kw">new</span> <span class="fn">Node</span>(val);

ALGOS.hashTable={
  title:'雜湊表 Hash Table',
  desc:'雜湊表是最快的資料結構之一：把 key 丟進雜湊函數，算出要放到哪個「桶」，查詢時同樣算一次就找到，平均 O(1)。當不同 key 算出同一個桶（碰撞），用鏈結串列串接解決。JavaScript 的 Object、Map 底層都是雜湊表。',
  buildSteps(){
    const SIZE=7;
    const table=Array(SIZE).fill(null).map(()=>[]);
    const hash=key=>{ let h=0; for(const c of key) h=(h*31+c.charCodeAt(0))%SIZE; return h; };
    const entries=[['name','Alice'],['age','25'],['city','Taipei'],['job','Dev'],['lang','JS']];
    const st=[];

    // Layout: 7 buckets spread horizontally, items pile up below each bucket header
    const BTOP=90;   // y of bucket headers
    const BH=26;     // bucket header height
    const ITEM_H=22; // item tile height
    const ITEM_GAP=2;

    const bw=()=>Math.floor((CW()-16)/SIZE);
    const bx=i=>8+i*bw();

    // key label at top center, hash formula below it
    const makeS=(tbl, activeSlot, inputKey, inputVal, hashVal, showArrow)=>{
      const spr={};
      const bWidth=bw();

      // Top: input key pill
      if(inputKey){
        const kw=Math.max(80, inputKey.length*9+inputVal.length*8+24);
        const kx=CW()/2-kw/2;
        spr['key-bg']={type:'rect',x:kx,y:6,w:kw,h:28,r:14,color:'#1f3a5f',text:`"${inputKey}"  →  "${inputVal}"`,tc:C.act,font:'bold 12px sans-serif',z:4};
        if(hashVal!=null){
          // formula label
          spr['hash-formula']={type:'label',x:CW()/2,y:48,
            text:`hash("${inputKey}") mod ${SIZE}  =  ${hashVal}`,
            color:C.muted,font:'12px sans-serif',align:'center',z:4};
          // arrow from key to bucket
          if(showArrow){
            const tx=bx(hashVal)+bWidth/2;
            spr['hash-arrow']={type:'edge',x1:CW()/2,y1:52,x2:tx,y2:BTOP-4,
              color:C.act,lw:2,z:3};
            spr['hash-bucket-hi']={type:'label',x:tx,y:BTOP-8,
              text:'↓',color:C.act,font:'bold 16px sans-serif',align:'center',z:4};
          }
        }
      }

      // Bucket headers row
      for(let i=0;i<SIZE;i++){
        const x=bx(i);
        const isActive=i===activeSlot;
        const hasItems=tbl[i].length>0;
        spr[`bh${i}`]={type:'rect',x,y:BTOP,w:bWidth-4,h:BH,r:5,
          color:isActive?C.act:hasItems?'#1e3a2a':'#1a2332',
          text:String(i),tc:isActive?'#fff':hasItems?C.done:C.muted,
          font:`bold 13px sans-serif`,z:2};

        if(!tbl[i].length){
          spr[`null${i}`]={type:'label',x:x+(bWidth-4)/2,y:BTOP+BH+12,
            text:'∅',color:'#2d3748',font:'14px sans-serif',align:'center',z:1};
        }

        // Items stacked below bucket header
        tbl[i].forEach((pair,j)=>{
          const iy=BTOP+BH+ITEM_GAP+(j*(ITEM_H+ITEM_GAP));
          const isNew=isActive&&j===tbl[i].length-1;
          spr[`item${i}-${j}`]={
            type:'rect',x:x+1,y:iy,w:bWidth-6,h:ITEM_H,r:3,
            color:isNew?'#1e4030':'#1a2a3a',
            text:`${pair[0]}:${pair[1]}`,tc:isNew?C.done:C.muted,
            font:'10px sans-serif',z:2,
            _fx:x+1,_fy:BTOP-30,_fo:0
          };
          if(j<tbl[i].length-1){
            spr[`chain${i}-${j}`]={type:'label',
              x:x+(bWidth-4)/2,y:iy+ITEM_H+1,
              text:'↓',color:'#3d4455',font:'10px sans-serif',align:'center',z:3};
          }
        });

        // Collision badge
        if(tbl[i].length>1){
          spr[`coll${i}`]={type:'label',x:x+bWidth-8,y:BTOP-2,
            text:`×${tbl[i].length}`,color:C.pivot,font:'bold 10px sans-serif',align:'right',z:5};
        }
      }
      return spr;
    };

    st.push({sprites:makeS(table,-1,null,null,null,false),
      info:`雜湊表有 <b>${SIZE} 個桶（編號 0–${SIZE-1}）</b>。每個 key 透過雜湊函數直接算出桶號，存取 O(1)。<b class="ok">綠色桶</b> = 有資料，<b class="warn">橘色 ×n</b> = 碰撞鏈長度`});

    for(const [k,v] of entries){
      const h=hash(k);
      // Step 1: show key + formula
      st.push({sprites:makeS(table,-1,k,v,h,false),
        info:`準備插入 <b>"${k}"</b>。把每個字元的 ASCII 碼代入公式 → <b>h = h×31 + charCode</b>，最後 mod ${SIZE}，得到桶號 <span class="hi"><b>${h}</b></span>`, line:2});
      // Step 2: show arrow pointing to bucket
      st.push({sprites:makeS(table,h,k,v,h,true),
        info:`hash("${k}") = <span class="hi"><b>${h}</b></span>，箭頭指向桶 <b>[${h}]</b>，現在把 <b>"${k}":"${v}"</b> 放進去！`, line:2});
      // Step 3: item lands in bucket
      table[h].push([k,v]);
      const collision=table[h].length>1;
      st.push({sprites:makeS(table,h,null,null,null,false),
        info: collision
          ? `<span class="warn">⚠️ 碰撞！桶 [${h}] 已有 ${table[h].length-1} 個元素。</span>新項目鏈結到桶的尾端（鏈結法 Chaining），查詢時逐個比對`
          : `<span class="ok">✅ ">${k}":"${v}" 成功放入桶 [${h}]</span>，下次查詢只需再算一次 hash，直接取出，O(1)！`, line:3});
    }
    return st;
  },
  code:`<span class="kw">class</span> <span class="fn">HashTable</span> {
  <span class="fn">constructor</span>(size=<span class="num">53</span>){<span class="kw">this</span>.t=Array(size).fill(<span class="kw">null</span>).map(()=>[]);}
  <span class="fn">_hash</span>(key){ <span class="kw">let</span> h=<span class="num">0</span>; <span class="kw">for</span>(<span class="kw">const</span> c <span class="kw">of</span> key) h=(h*<span class="num">31</span>+c.charCodeAt(<span class="num">0</span>))%<span class="kw">this</span>.t.length; <span class="kw">return</span> h; }
  <span class="fn">set</span>(k,v){ <span class="kw">const</span> slot=<span class="kw">this</span>.t[<span class="kw">this</span>.<span class="fn">_hash</span>(k)]; <span class="kw">const</span> p=slot.find(x=>x[<span class="num">0</span>]===k); p?p[<span class="num">1</span>]=v:slot.push([k,v]); }
  <span class="fn">get</span>(k){ <span class="kw">return</span> <span class="kw">this</span>.t[<span class="kw">this</span>.<span class="fn">_hash</span>(k)].find(x=>x[<span class="num">0</span>]===k)?.[<span class="num">1</span>]; }
}`,
  tips:{
    native:{
      code:`// JS 提供三種原生 Hash 結構：

// 1. Map — 最完整，key 可為任何型別
const map = new Map();
map.set('name', 'Alice');
map.get('name'); // → 'Alice'

// 2. Set — 自動去重複
const set = new Set([1,2,2,3]); // {1,2,3}

// 3. 物件 {} — 只能用 string/symbol 為 key
const obj = { name: 'Bob' };`,
      note:`JS 的 <code>Map</code> 比 Object 更完整：支援任何型別的 key、維護插入順序、有 <code>size</code> 屬性。<b>Map/Set 的 has/get/set 都是接近 O(1)</b>，底層就是 Hash Table。`
    },
    cases:[
      '計數器：統計字元/單字出現次數 map.set(k, (map.get(k)||0)+1)',
      '去重複：const unique = [...new Set(arr)]',
      '快取（Memoization）：以輸入為 key，結果為 value',
      '圖的鄰接表：以節點 ID 為 key，鄰居列表為 value',
      '查找表（Lookup Table）：O(1) 取代 O(n) 的線性搜尋'
    ]
  }
};

function graphLayout(){
  const W=CW();
  return {
    nodes:{
      4:{x:W*.5,  y:38,  label:4},
      2:{x:W*.27, y:98,  label:2},
      6:{x:W*.73, y:98,  label:6},
      1:{x:W*.14, y:162, label:1},
      3:{x:W*.39, y:162, label:3},
      5:{x:W*.61, y:162, label:5},
      7:{x:W*.86, y:162, label:7},
    },
    edges:[[4,2],[4,6],[2,1],[2,3],[6,5],[6,7]]
  };
}

function makeTreeSpr(visited,active){
  const {nodes,edges}=graphLayout();
  const spr={};
  edges.forEach(([a,b])=>{
    const na=nodes[a],nb=nodes[b];
    spr[`e${a}-${b}`]={type:'edge',x1:na.x,y1:na.y,x2:nb.x,y2:nb.y,color:C.edge,lw:1.5,z:0};
  });
  Object.entries(nodes).forEach(([id,n])=>{
    const nid=+id;
    const isDone=visited.includes(nid);
    const isAct=active===nid;
    spr[`n${nid}`]={type:'circle',x:n.x,y:n.y,r:20,
      color:isAct?C.act:isDone?C.done:C.node,
      text:String(n.label),stroke:isAct?C.act:isDone?C.done:C.edge,z:1};
  });
  return spr;
}

ALGOS.bstTraversal={
  title:'二元樹走訪 BST Traversal',
  desc:'二元搜尋樹的中序走訪（左→根→右）會輸出有序序列，這是它最重要的性質。走訪用遞迴實作：先走完左子樹、訪問根節點、再走右子樹。時間 O(n)，空間 O(h)（h = 樹高）。',
  buildSteps(){
    const st=[];
    const visited=[];
    const {nodes}=graphLayout();
    const children=(id)=>{
      const n=nodes[id]; const {edges}=graphLayout();
      return edges.filter(([p])=>p===id).map(([,c])=>c);
    };
    st.push({sprites:makeTreeSpr([],null),info:'二元搜尋樹，根節點 = <b>4</b>。規則：左子樹所有值 &lt; 根，右子樹所有值 &gt; 根。中序走訪順序：<b>左 → 根 → 右</b>'});
    function inorder(id){
      if(!nodes[id]) return;
      const ch=children(id);
      const left=ch.find(c=>nodes[c].x<nodes[id].x);
      const right=ch.find(c=>nodes[c].x>nodes[id].x);
      st.push({sprites:makeTreeSpr([...visited],id),info:`到達節點 <span class="hi">${id}</span>：先往<b>左</b>走${left?`（進入子樹 ${left}）`:'（無左子節點，返回）'}`, line:3});
      if(left) inorder(left);
      visited.push(id);
      st.push({sprites:makeTreeSpr([...visited],id),info:`<span class="ok">✔ 節點 <b>${id}</b> 加入結果</span>　目前序列：[<b>${visited.join(', ')}</b>]　再往<b>右</b>走${right?`（進入子樹 ${right}）`:'（無右子節點，返回）'}`, line:4});
      if(right) inorder(right);
    }
    inorder(4);
    st.push({sprites:makeTreeSpr([...visited],null),info:`<span class="ok">✅ 中序走訪完成！結果：[<b>${visited.join(', ')}</b>]　自動排序！這正是 BST 最神奇的性質。</span>`, line:6});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">inorder</span>(node, res=[]) {
  <span class="kw">if</span>(!node) <span class="kw">return</span> res;
  <span class="fn">inorder</span>(node.left, res);
  res.push(node.val);
  <span class="fn">inorder</span>(node.right, res);
  <span class="kw">return</span> res;
}
<span class="cm">// 中序結果必然有序：[1,2,3,4,5,6,7]</span>`,
  tips:{
    native:{
      code:`// 三種走訪方式的記憶口訣：
// 前序 Pre:  根→左→右（複製樹、序列化）
// 中序 In:   左→根→右（輸出有序結果）★
// 後序 Post: 左→右→根（刪除樹、計算目錄大小）

// 中序走訪 = 排序輸出，這就是 BST 最大的優勢！`,
      note:`BST 的中序走訪保證輸出有序，等同於一次 O(n) 的排序。<b>實務上用 JS 的 Map（紅黑樹實作）</b> 取代手動 BST，搜尋/插入/刪除皆 O(log n)。`
    },
    cases:[
      '資料庫索引：MySQL、PostgreSQL 的 B-Tree 索引基礎',
      '自動完成（Autocomplete）：前綴樹（Trie）是特化的樹結構',
      '範圍查詢：找出所有在 [min, max] 區間的值',
      '排行榜系統：按分數排列，快速插入新分數',
      '檔案系統：目錄結構天然是樹形，後序走訪計算大小'
    ]
  }
};

// ══ BFS ══════════════════════════════════════════════════════
function graphBFS_Layout(){
  const W=CW();
  return {
    nodes:{0:{x:W*.5,y:35},1:{x:W*.27,y:100},2:{x:W*.73,y:100},
           3:{x:W*.13,y:170},4:{x:W*.38,y:170},5:{x:W*.62,y:170},6:{x:W*.87,y:170}},
    adj:{0:[1,2],1:[0,3,4],2:[0,5,6],3:[1],4:[1],5:[2],6:[2]},
    edges:[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]]
  };
}
function makeGraphSpr(visited,active,adj_unused,edges,nodes){
  const spr={};
  edges.forEach(([a,b])=>{
    const na=nodes[a],nb=nodes[b];
    const isAct=(active===a||active===b)&&(visited.includes(a)||visited.includes(b));
    spr[`e${a}-${b}`]={type:'edge',x1:na.x,y1:na.y,x2:nb.x,y2:nb.y,
      color:isAct?C.eAct:C.edge,lw:isAct?2:1.5,z:0};
  });
  Object.entries(nodes).forEach(([id,n])=>{
    const nid=+id;
    spr[`n${nid}`]={type:'circle',x:n.x,y:n.y,r:20,
      color:nid===active?C.act:visited.includes(nid)?C.done:C.node,
      text:String(nid),stroke:C.edge,z:1};
  });
  return spr;
}

ALGOS.bfs={
  title:'廣度優先搜尋 BFS',
  desc:'廣度優先搜尋就像水波擴散：從起點開始，先把所有「距離 1 步」的鄰居全訪問完，再訪問「距離 2 步」的，以此類推。使用 Queue 確保順序。能找到無權圖的最短路徑。時間 O(V+E)。',
  buildSteps(){
    const {nodes,adj,edges}=graphBFS_Layout();
    const st=[];
    const visited=[],queue=[0],seen=new Set([0]);
    st.push({sprites:makeGraphSpr([],null,adj,edges,nodes),info:'BFS 從節點 <b>0</b> 出發。使用 <b>Queue（佇列）</b> 確保「近的先處理」。<b class="ok">綠色</b> = 已訪問，<b class="hi">藍色</b> = 當前節點'});
    while(queue.length){
      const cur=queue.shift();
      visited.push(cur);
      st.push({sprites:makeGraphSpr([...visited],cur,adj,edges,nodes),info:`從 Queue 取出 <span class="hi"><b>${cur}</b></span>，標記為已訪問　Queue 剩餘：[${queue.join(', ')||'空'}]`, line:4});
      for(const nb of adj[cur]){
        if(!seen.has(nb)){
          seen.add(nb); queue.push(nb);
          st.push({sprites:makeGraphSpr([...visited],cur,adj,edges,nodes),info:`節點 ${cur} 的鄰居 <span class="warn"><b>${nb}</b></span> 尚未訪問 → 加入 Queue 尾端　Queue：[${queue.join(', ')}]`, line:[6,7]});
        }
      }
    }
    st.push({sprites:makeGraphSpr([...visited],null,adj,edges,nodes),info:`<span class="ok">✅ BFS 完成！走訪順序：[<b>${visited.join(' → ')}</b>]　每一層距離的節點都被逐層訪問</span>`, line:8});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">bfs</span>(graph, start) {
  <span class="kw">const</span> visited=<span class="kw">new</span> Set([start]), queue=[start], res=[];
  <span class="kw">while</span>(queue.length){
    <span class="kw">const</span> node=queue.shift();
    res.push(node);
    <span class="kw">for</span>(<span class="kw">const</span> nb <span class="kw">of</span> graph[node])
      <span class="kw">if</span>(!visited.has(nb)){ visited.add(nb); queue.push(nb); }
  }
  <span class="kw">return</span> res;
}`,
  tips:{
    native:{
      code:`// BFS 核心：用 Queue（Array）+ Set 追蹤已訪問
function bfs(graph, start) {
  const visited = new Set([start]);
  const queue = [start], res = [];
  while(queue.length) {
    const node = queue.shift();
    res.push(node);
    for(const nb of graph[node])
      if(!visited.has(nb)){ visited.add(nb); queue.push(nb); }
  }
  return res;
}`,
      note:`BFS 保證找到<b>最短路徑</b>（在無權圖中）。用 <code>Set</code> 追蹤已訪問節點使查詢 O(1)。若圖很大，注意 <code>queue.shift()</code> 是 O(n)，可換成自定義高效佇列。`
    },
    cases:[
      '社群網路「你可能認識的朋友」：找二度、三度人脈',
      '地圖最短路徑：迷宮、棋盤問題找最少步數',
      '網路爬蟲：逐層爬取網頁連結',
      '二元樹層序走訪：按層輸出節點',
      'P2P 網路拓撲：找節點間的最短連接跳數'
    ]
  }
};

  buildSteps(){
    const {nodes,adj,edges}=graphBFS_Layout();

    st.push({sprites:makeGraphSpr([],null,adj,edges,nodes),info:'DFS 從節點 <b>0</b> 出發。使用 <b>Stack（堆疊）</b>，每次都從頂端取最新放入的節點，確保「深入優先」。<b class="ok">綠色</b> = 已訪問'});
    while(stack.length){
      const cur=stack.pop();
      if(seen.has(cur)) continue;

      for(const nb of [...adj[cur]].reverse()){
        if(!seen.has(nb)){
          stack.push(nb);
          st.push({sprites:makeGraphSpr([...visited],cur,adj,edges,nodes),info:`節點 ${cur} 的鄰居 <span class="warn"><b>${nb}</b></span> 尚未訪問 → 壓入 Stack 頂端　Stack：[${stack.join(', ')}]　（下一步就從這裡繼續深入）`, line:[6,7]});
        }
      }
    }
    st.push({sprites:makeGraphSpr([...visited],null,adj,edges,nodes),info:`<span class="ok">✅ DFS 完成！走訪順序：[<b>${visited.join(' → ')}</b>]　注意與 BFS 的差異：DFS 先深入一條路走到底</span>`, line:8});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">dfs</span>(graph, start) {
  <span class="kw">const</span> visited=<span class="kw">new</span> Set(), stack=[start], res=[];
  <span class="kw">while</span>(stack.length){
    <span class="kw">const</span> node=stack.pop();
    <span class="kw">if</span>(visited.has(node)) <span class="kw">continue</span>;
    visited.add(node); res.push(node);
    <span class="kw">for</span>(<span class="kw">const</span> nb <span class="kw">of</span> graph[node])

}`,
  tips:{

      code:`// 迭代版 DFS（用 Stack，避免遞迴 call stack 爆炸）
function dfs(graph, start) {

ALGOS.divideConquer={
  title:'分治法 Divide & Conquer',
  desc:'把大問題拆成相同結構的小問題，遞迴解決後合併結果。三步驟：① 分割（Divide）② 解決子問題（Conquer）③ 合併（Combine）。合併排序、快速排序都是分治法。此例示範「分治找最大值」。',
  buildSteps(){
    const vals=[38,27,43,3,82,10];
    const n=vals.length;
    const maxV=Math.max(...vals);
    const st=[];
    const mkS=(hiL=-1,hiR=-1,done=[],cmp=[])=>{
      const {pad,gap,bw}=barLayout(n);
      const spr={};
      vals.forEach((v,i)=>{
        const h=Math.max(14,Math.round((v/maxV)*150));
        const x=pad+i*(bw+gap);
        const y=CH-30-h;
        let color=C.bar;
        if(done.includes(i)) color=C.done;
        else if(cmp.includes(i)) color=C.act;
        else if(i>=hiL&&i<=hiR) color='#2a4a7f';
        spr[`b${i}`]={type:'bar',x,y,w:bw,h,color,text:String(vals[i]),z:1};
      });
      return spr;
    };
    st.push({sprites:mkS(0,n-1),info:'<b>分治法</b>：把陣列對半切，各自找最大值，再比較兩邊的最大值。時間複雜度 O(n)，但能<b>並行處理</b>左右子問題',line:1});
    const results=[];
    function solve(l,r){
      if(l===r){
        st.push({sprites:mkS(l,r,[],[l]),info:`<b>子問題 [${l}]</b>：只有一個元素 <span class="hi">${vals[l]}</span>，直接回傳它`,line:3});
        return l;
      }
      const mid=Math.floor((l+r)/2);
      st.push({sprites:mkS(l,r,[]),info:`<b>分割</b> [${l}..${r}]：中點 mid=${mid}，切成左 [${l}..${mid}] 和右 [${mid+1}..${r}]`,line:5});
      const li=solve(l,mid);
      const ri=solve(mid+1,r);
      const winner=vals[li]>=vals[ri]?li:ri;
      st.push({sprites:mkS(l,r,[winner],[li,ri]),info:`<b>合併</b> [${l}..${r}]：左最大 <span class="hi">${vals[li]}</span> vs 右最大 <span class="hi">${vals[ri]}</span>，勝出 <span class="ok">${vals[winner]}</span>`,line:8});
      return winner;
    }
    const ans=solve(0,n-1);
    st.push({sprites:mkS(0,n-1,[ans]),info:`<b class="ok">完成！</b>最大值 <span class="ok">${vals[ans]}</span> 找到。分治法的優勢：左右子樹可以<b>平行計算</b>，適合多核心處理器`});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">findMax</span>(arr, l=<span class="num">0</span>, r=arr.length-<span class="num">1</span>) {
  <span class="cm">// ① 基本情況（只剩1個）</span>
  <span class="kw">if</span> (l === r) <span class="kw">return</span> arr[l];
  <span class="cm">// ② 分割</span>
  <span class="kw">const</span> mid = (l + r) >> <span class="num">1</span>;
  <span class="cm">// ③ 遞迴解決子問題</span>
  <span class="kw">const</span> leftMax  = <span class="fn">findMax</span>(arr, l, mid);
  <span class="kw">const</span> rightMax = <span class="fn">findMax</span>(arr, mid+<span class="num">1</span>, r);
  <span class="cm">// ④ 合併</span>
  <span class="kw">return</span> Math.max(leftMax, rightMax);
}
<span class="fn">findMax</span>([<span class="num">38</span>,<span class="num">27</span>,<span class="num">43</span>,<span class="num">3</span>,<span class="num">82</span>,<span class="num">10</span>]); <span class="cm">// → 82</span>`,
  tips:{
    native:{
      code:`// JS 內建 Math.max 底層就是線性掃描
Math.max(...arr);          // → 82（展開運算子）
Math.max.apply(null, arr); // 等價，適合大陣列
arr.reduce((a,b)=>a>b?a:b); // Reduce 版本`,
      note:`分治法的真正價值在<b>可並行化</b>：左右子問題完全獨立，可以分給不同 CPU 核心同時計算。MapReduce 大數據框架就是分治法的工業級應用。`
    },
    cases:['合併排序 / 快速排序：天生的分治結構','MapReduce：大數據平行處理框架的核心思想','矩陣乘法（Strassen）：比暴力法更快的分治矩陣運算','FFT 快速傅立葉轉換：信號處理的核心演算法']
  }
};

ALGOS.recursion={
  title:'遞迴 Recursion',
  desc:'函式呼叫自己來解決「更小的同類問題」。關鍵兩要素：① 基本情況（Base Case）— 停止條件，防止無限迴圈；② 遞迴情況（Recursive Case）— 縮小問題規模。此例示範 n! = n × (n-1)!',
  buildSteps(){
    const N=5;
    const st=[];
    const mkStack=(frames,retVal=null)=>{
      const spr={};
      const FH=32,FW=Math.min(180,CW()-40),FX=(CW()-FW)/2;
      const colors=['#1f3a5f','#1a3a2a','#3a2a1a','#2a1a3a','#1a2a3a','#2a3a1a'];
      frames.forEach((f,i)=>{
        const y=CH-20-(i+1)*FH-i*4;
        spr[`fr${i}`]={type:'rect',x:FX,y,w:FW,h:FH-2,color:colors[i%colors.length],text:`factorial(${f.n})`,font:'bold 13px sans-serif',z:1,_fy:CH,_fo:0};
        spr[`fv${i}`]={type:'label',x:FX+FW-8,y:y+FH/2-1,text:f.ret!=null?`= ${f.ret}`:'...',color:f.ret!=null?'#3fb950':'#8b949e',font:'12px sans-serif',align:'right',z:2};
      });
      if(retVal!=null){
        spr['ans']={type:'label',x:CW()/2,y:18,text:`答案：${retVal}`,color:'#3fb950',font:'bold 16px sans-serif',align:'center',z:3,_fo:0};
      }
      spr['base']={type:'label',x:CW()/2,y:CH-6,text:'呼叫堆疊（Call Stack）',color:'#8b949e',font:'11px sans-serif',align:'center',z:0};
      return spr;
    };
    st.push({sprites:mkStack([]),info:'遞迴呼叫前，<b>呼叫堆疊（Call Stack）</b>是空的。每次呼叫函式都會推入一個新的「堆疊框（Frame）」',line:1});
    const frames=[];
    for(let i=N;i>=1;i--){
      frames.push({n:i,ret:null});
      st.push({sprites:mkStack([...frames]),info:`呼叫 <span class="hi">factorial(${i})</span>，推入堆疊。${i}>1 所以繼續遞迴呼叫 factorial(${i-1})`,line:i===1?3:5});
    }
    frames.push({n:0,ret:null});
    st.push({sprites:mkStack([...frames]),info:`呼叫 <span class="hi">factorial(0)</span>，<b class="ok">觸發基本情況（Base Case）</b>！回傳 1，開始回溯`,line:3});
    // unwind
    let acc=1;
    frames.pop();
    frames[frames.length-1].ret=1;
    for(let i=1;i<=N;i++){
      acc*=i;
      if(frames.length>1){frames.pop();}
      if(frames.length>0) frames[frames.length-1].ret=acc;
      st.push({sprites:mkStack([...frames],i===N?acc:null),info:`<span class="ok">factorial(${i}) = ${i} × ${acc/i} = <b>${acc}</b></span>，彈出堆疊框，將結果回傳給上一層`,line:5});
    }
    st.push({sprites:mkStack([],acc),info:`<b class="ok">完成！factorial(${N}) = ${acc}</b>。所有堆疊框都已彈出，答案回到最初呼叫者`,line:1});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">factorial</span>(n) {
  <span class="cm">// ① 基本情況：停止遞迴</span>
  <span class="kw">if</span> (n <= <span class="num">1</span>) <span class="kw">return</span> <span class="num">1</span>;
  <span class="cm">// ② 遞迴情況：縮小問題</span>
  <span class="kw">return</span> n * <span class="fn">factorial</span>(n - <span class="num">1</span>);
}
<span class="fn">factorial</span>(<span class="num">5</span>); <span class="cm">// → 120</span>
<span class="cm">// 展開：5×4×3×2×1 = 120</span>`,
  tips:{
    native:{
      code:`// 迭代版本（避免 call stack overflow）
function factorial(n) {
  let result = 1;
  for (let i = 2; i <= n; i++) result *= i;
  return result;
}

  code:`<span class="kw">function</span> <span class="fn">climbStairs</span>(n) {

ALGOS.shellSort={
  title:'謝耳排序 Shell Sort',
  desc:'插入排序的改良版：先用大間距（gap）比較交換，讓元素快速移動到接近正確位置，再逐漸縮小 gap 直到 gap=1。最終的 gap=1 就是插入排序，但此時陣列幾乎有序，速度極快。時間複雜度約 O(n^1.3)。',
  buildSteps(){
    const vals=[64,34,25,12,22,11,90];
    const arr=[...vals];
    const n=arr.length;
    const maxV=Math.max(...vals);
    const st=[];
    const mkS=(arr,cmp=[],swap=[],done=[])=>{
      const {pad,gap,bw}=barLayout(n);
      const spr={};
      arr.forEach((v,i)=>{
        const h=Math.max(12,Math.round((v/maxV)*150));
        const x=pad+i*(bw+gap);
        const y=CH-30-h;
        const color=done.includes(i)?C.done:swap.includes(i)?C.swap:cmp.includes(i)?C.act:C.bar;
        spr[`b${i}`]={type:'bar',x,y,w:bw,h,color,text:String(v),z:1};
      });
      return spr;
    };
    let gapSize=Math.floor(n/2);
    st.push({sprites:mkS(arr),info:`<b>Shell Sort</b>：初始陣列。gap 從 ${Math.floor(n/2)} 開始，每輪縮半，最後 gap=1 時完成`,line:1});
    while(gapSize>0){
      st.push({sprites:mkS(arr),info:`<b>gap = ${gapSize}</b>：比較間距為 ${gapSize} 的元素對`,line:2});
      for(let i=gapSize;i<n;i++){
        let j=i;
        st.push({sprites:mkS(arr,[j,j-gapSize]),info:`比較 arr[${j-gapSize}]=${arr[j-gapSize]} 和 arr[${j}]=${arr[j]}（間距 ${gapSize}）`,line:4});
        while(j>=gapSize&&arr[j-gapSize]>arr[j]){
          [arr[j],arr[j-gapSize]]=[arr[j-gapSize],arr[j]];
          st.push({sprites:mkS(arr,[],[j,j-gapSize]),info:`<span class="warn">交換！</span>arr[${j-gapSize}]↔arr[${j}]，向前比較`,line:5});
          j-=gapSize;
        }
      }
      gapSize=Math.floor(gapSize/2);
    }
    st.push({sprites:mkS(arr,[],[],arr.map((_,i)=>i)),info:'<b class="ok">排序完成！</b>Shell Sort 透過大間距預先整理，讓最終插入排序幾乎不需移動'});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">shellSort</span>(arr) {
  <span class="kw">let</span> gap = Math.floor(arr.length / <span class="num">2</span>);
  <span class="kw">while</span> (gap > <span class="num">0</span>) {
    <span class="kw">for</span> (<span class="kw">let</span> i=gap; i<arr.length; i++) {
      <span class="kw">let</span> j=i, temp=arr[i];
      <span class="kw">while</span> (j>=gap && arr[j-gap]>temp) {
        arr[j]=arr[j-gap]; j-=gap;
      }
      arr[j]=temp;
    }
    gap = Math.floor(gap / <span class="num">2</span>);
  }
  <span class="kw">return</span> arr;
}
<span class="fn">shellSort</span>([<span class="num">64</span>,<span class="num">34</span>,<span class="num">25</span>,<span class="num">12</span>,<span class="num">22</span>,<span class="num">11</span>,<span class="num">90</span>]);`,

  buildSteps(){

ALGOS.interpolation={
  title:'內插搜尋 Interpolation Search',
  desc:'二分搜尋的改良版：二分搜尋每次切中間，內插搜尋根據目標值的「大小」預測位置。就像查字典：找「Z」開頭的字，直接翻到最後幾頁，而不是從中間開始。資料均勻分布時平均 O(log log n)。',
  buildSteps(){
    const vals=[2,5,8,12,16,23,38,56,72,91];
    const target=23;
    const n=vals.length;
    const maxV=vals[n-1];
    const st=[];
    const mkS=(lo,hi,mid=-1,found=-1)=>{
      const {pad,gap,bw}=barLayout(n);
      const spr={};
      vals.forEach((v,i)=>{
        const h=Math.max(10,Math.round((v/maxV)*150));
        const x=pad+i*(bw+gap);
        const y=CH-30-h;
        let color=C.bar;
        if(found===i) color=C.done;
        else if(i===mid) color=C.act;
        else if(i<lo||i>hi) color='#1e2530';
        else if(i===lo||i===hi) color='#2d5a8e';
        spr[`b${i}`]={type:'bar',x,y,w:bw,h,color,text:String(v),z:1,top:i===lo?'lo':i===hi?'hi':i===mid?'pos':undefined};
      });
      return spr;
    };
    let lo=0,hi=n-1;
    st.push({sprites:mkS(lo,hi),info:`<b>內插搜尋</b>：目標 <span class="hi">${target}</span>，陣列已排序。公式：pos = lo + (target-arr[lo])/(arr[hi]-arr[lo]) × (hi-lo)`,line:1});
    while(lo<=hi&&target>=vals[lo]&&target<=vals[hi]){
      const pos=Math.floor(lo+(target-vals[lo])/(vals[hi]-vals[lo])*(hi-lo));
      st.push({sprites:mkS(lo,hi,pos),info:`插值計算：pos = ${lo} + (${target}-${vals[lo]})/(${vals[hi]}-${vals[lo]}) × (${hi}-${lo}) = <b>${pos}</b>，arr[${pos}]=${vals[pos]}`,line:3});
      if(vals[pos]===target){
        st.push({sprites:mkS(lo,hi,pos,pos),info:`<span class="ok">找到目標 ${target}！</span>位置 ${pos}，內插比二分搜尋更快到達目標`,line:4});
        return st;
      } else if(vals[pos]<target){
        lo=pos+1;
        st.push({sprites:mkS(lo,hi),info:`arr[${pos}]=${vals[pos]} < ${target}，目標在右側，lo 移到 ${lo}`,line:6});
      } else {
        hi=pos-1;
        st.push({sprites:mkS(lo,hi),info:`arr[${pos}]=${vals[pos]} > ${target}，目標在左側，hi 移到 ${hi}`,line:8});
      }
    }
    st.push({sprites:mkS(lo,hi),info:`<span class="err">未找到 ${target}</span>`});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">interpolationSearch</span>(arr, target) {
  <span class="kw">let</span> lo=<span class="num">0</span>, hi=arr.length-<span class="num">1</span>;
  <span class="kw">while</span>(lo<=hi && target>=arr[lo] && target<=arr[hi]){
    <span class="cm">// 插值公式（預測目標位置）</span>
    <span class="kw">const</span> pos = lo + Math.floor(
      (target-arr[lo])/(arr[hi]-arr[lo]) * (hi-lo));
    <span class="kw">if</span>(arr[pos]===target) <span class="kw">return</span> pos;
    <span class="kw">if</span>(arr[pos]<target)  lo=pos+<span class="num">1</span>;
    <span class="kw">else</span>                 hi=pos-<span class="num">1</span>;
  }
  <span class="kw">return</span> -<span class="num">1</span>;
}`,
  tips:{
    native:{
      code:`// 無 JS 內建，但概念可用於索引預測
// 均勻分布時：O(log log n) ≈ 幾乎 O(1)
// 非均勻分布時：退化為 O(n)

// 二分搜尋更穩定，推薦用於一般場景`,
      note:`內插搜尋假設資料<b>均勻分布</b>。電話簿查詢、有序數值索引是典型適用場景。若資料分布不均（如指數增長），二分搜尋更可靠。`
    },
    cases:['電話簿查詢：姓名均勻分布，直接預測位置','數值範圍均勻的感測器資料搜尋','遊戲中的物品等級/數值查表','大型排序陣列的快速定位']

ALGOS.fibSearch={
  title:'費氏搜尋 Fibonacci Search',
  desc:'利用費波那契數列決定分割點，而非每次取中間。費波那契搜尋只使用加減法（不需除法），對某些硬體更友善。前提：陣列已排序。時間複雜度 O(log n)。',
  buildSteps(){
    const vals=[2,5,8,12,16,23,38,56,72,91];
    const target=56;
    const n=vals.length;
    const maxV=vals[n-1];
    const st=[];
    // generate fibonacci numbers
    const fibs=[0,1];
    while(fibs[fibs.length-1]<n) fibs.push(fibs[fibs.length-1]+fibs[fibs.length-2]);
    const mkS=(lo,pos,fibK,found=-1)=>{
      const {pad,gap,bw}=barLayout(n);
      const spr={};
      vals.forEach((v,i)=>{
        const h=Math.max(10,Math.round((v/maxV)*150));
        const x=pad+i*(bw+gap);
        const y=CH-30-h;
        let color=C.bar;
        if(found===i) color=C.done;
        else if(i===pos) color=C.act;
        else if(i<lo) color='#1e2530';
        spr[`b${i}`]={type:'bar',x,y,w:bw,h,color,text:String(v),z:1,top:i===pos?'fib':'',};
      });
      spr['fibinfo']={type:'label',x:CW()/2,y:12,text:`使用費波那契數：F(k-2)=${fibs[Math.max(0,fibK-2)]} F(k-1)=${fibs[Math.max(0,fibK-1)]} F(k)=${fibs[Math.max(0,fibK)]}`,color:'#8b949e',font:'11px sans-serif',align:'center',z:3};
      return spr;
    };
    let fibK=fibs.length-1;
    while(fibs[fibK]>n) fibK--;
    let lo=0;
    st.push({sprites:mkS(0,fibs[fibK]-1,fibK),info:`<b>費氏搜尋</b>：目標 <span class="hi">${target}</span>。用費波那契數列 ${fibs.slice(0,fibK+1).join(', ')} 決定分割點`,line:1});
    while(fibK>1){
      const pos=Math.min(lo+fibs[fibK-1]-1,n-1);
      st.push({sprites:mkS(lo,pos,fibK),info:`F(k)=${fibs[fibK]}，分割點 pos = lo(${lo}) + F(k-1)(${fibs[fibK-1]}) - 1 = <b>${pos}</b>，arr[${pos}]=${vals[pos]}`,line:4});
      if(vals[pos]===target){
        st.push({sprites:mkS(lo,pos,fibK,pos),info:`<span class="ok">找到 ${target}！</span>位置 ${pos}。費氏搜尋完全不用除法，只用加減`,line:5});
        return st;
      } else if(vals[pos]<target){
        lo=pos+1; fibK--;
        st.push({sprites:mkS(lo,pos,fibK),info:`arr[${pos}]=${vals[pos]} < ${target}，搜右半，lo→${lo}，Fibonacci 縮小一級`,line:7});
      } else {
        fibK-=2;
        st.push({sprites:mkS(lo,pos,fibK),info:`arr[${pos}]=${vals[pos]} > ${target}，搜左半，Fibonacci 縮小兩級`,line:9});
      }
    }
    if(fibK>=1&&vals[lo]===target){
      st.push({sprites:mkS(lo,lo,1,lo),info:`<span class="ok">找到 ${target}！</span>位置 ${lo}`});
    }
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">fibSearch</span>(arr, target) {
  <span class="kw">let</span> [fm2,fm1,fib]=[<span class="num">0</span>,<span class="num">1</span>,<span class="num">1</span>];
  <span class="kw">while</span>(fib<arr.length){[fm2,fm1,fib]=[fm1,fib,fm1+fib];}
  <span class="kw">let</span> lo=<span class="num">0</span>;
  <span class="kw">while</span>(fib><span class="num">1</span>){
    <span class="kw">const</span> pos=Math.min(lo+fm2-<span class="num">1</span>, arr.length-<span class="num">1</span>);
    <span class="kw">if</span>(arr[pos]<target){ [fm2,fm1,fib]=[fm1-fm2,fm2,fm1]; lo=pos+<span class="num">1</span>; }
    <span class="kw">else if</span>(arr[pos]>target){ [fm2,fm1,fib]=[fm2-fm1+fm2,fm2-fm1,fm2]; }
    <span class="kw">else return</span> pos;
  }
  <span class="kw">return</span> (fib&&arr[lo]===target)?lo:-<span class="num">1</span>;
}`,
  tips:{
    native:{
      code:`// 實務上二分搜尋更常用
// 費氏搜尋的優勢是「只用加減」
// 對無法做整數除法的硬體（如早期 CPU）有優勢

      note:`費氏搜尋是比較型搜尋，時間複雜度 O(log n) 與二分搜尋相同。主要優勢是避免除法，在某些嵌入式或早期硬體環境中有實際意義。`

      chars.forEach((c,i)=>{

ALGOS.deque={
  title:'雙向佇列 Deque',
  desc:'Double-Ended Queue（雙向佇列）：兩端都可以插入和刪除。結合了 Stack（後進先出）和 Queue（先進先出）的特性。滑動視窗問題的最佳資料結構。所有操作皆 O(1)。',
  buildSteps(){
    const ops=[
      {type:'pushBack',val:5},{type:'pushBack',val:3},{type:'pushFront',val:8},
      {type:'pushBack',val:1},{type:'popFront'},{type:'pushFront',val:9},{type:'popBack'},{type:'pushBack',val:7}
    ];
    const st=[];
    const BW=40,BH=40,GAP=6;
    // Use value-based IDs (dv_N) so tween tracks each element across frames,
    // giving proper slide animation on pop and slide-in on push.
    const mkS=(dq,newFront=false,newBack=false)=>{
      const spr={};
      const n=dq.length;
      if(n===0){
        spr['empty']={type:'label',x:CW()/2,y:CH/2,text:'( 空佇列 )',color:'#3d4455',font:'15px sans-serif',align:'center',z:0};
        spr['size']={type:'label',x:CW()/2,y:CH-6,text:'size = 0',color:'#8b949e',font:'12px sans-serif',align:'center',z:0};
        return spr;
      }
      const totalW=n*(BW+GAP)-GAP;
      const sx=Math.max(12,Math.floor((CW()-totalW)/2));
      dq.forEach((v,i)=>{
        const isNewF=i===0&&newFront, isNewB=i===n-1&&newBack;
        // Value-based ID → tween tracks element identity through insertions/removals
        spr[`dv_${v}`]={type:'rect',x:sx+i*(BW+GAP),y:CH/2-BH/2,w:BW,h:BH,
          color:isNewF?C.swap:isNewB?C.act:'#2d3748',text:String(v),font:'bold 16px sans-serif',z:2,
          _fx:isNewF?sx-70:isNewB?sx+totalW+30:undefined,
          _fy:CH/2-BH/2,
          _fo:isNewF||isNewB?0:undefined};
      });
      spr['lblL']={type:'label',x:sx+BW/2,y:CH/2-BH/2-15,text:'front',color:'#f85149',font:'bold 10px sans-serif',align:'center',z:1};
      spr['lblR']={type:'label',x:sx+totalW-BW/2,y:CH/2-BH/2-15,text:'back',color:'#58a6ff',font:'bold 10px sans-serif',align:'center',z:1};
      spr['arL']={type:'arrow',x:sx-18,y:CH/2,x2:sx,y2:CH/2,color:'#f85149',z:1};
      spr['arR']={type:'arrow',x:sx+totalW+18,y:CH/2,x2:sx+totalW,y2:CH/2,color:'#58a6ff',z:1};
      spr['size']={type:'label',x:CW()/2,y:CH-6,text:`size = ${n}`,color:'#8b949e',font:'12px sans-serif',align:'center',z:0};
      return spr;
    };
    const dq=[];
    st.push({sprites:mkS([]),info:'<b>Deque（雙向佇列）</b>：前端後端皆可插入/刪除。<span class="err">紅色</span> = 前端推入，<span class="hi">藍色</span> = 後端推入；pop 時元素平滑滑動',line:1});
    for(const op of ops){
      if(op.type==='pushBack'){
        dq.push(op.val);
        st.push({sprites:mkS([...dq],false,true),info:`<b>pushBack(${op.val})</b>：從後端推入 <span class="hi">${op.val}</span>（從右側滑入）　deque = [${dq.join(', ')}]`,line:5});
      } else if(op.type==='pushFront'){
        dq.unshift(op.val);
        st.push({sprites:mkS([...dq],true,false),info:`<b>pushFront(${op.val})</b>：從前端推入 <span class="err">${op.val}</span>（從左側滑入），其他元素右移　deque = [${dq.join(', ')}]`,line:3});
      } else if(op.type==='popFront'){
        const v=dq.shift();
        // No flash flag; element disappears, rest slide left via value-based IDs
        st.push({sprites:mkS([...dq]),info:`<b>popFront()</b> → 彈出前端 <span class="err">${v}</span>，其他元素向左滑動　deque = [${dq.join(', ')}]`,line:4});
      } else if(op.type==='popBack'){
        const v=dq.pop();
        st.push({sprites:mkS([...dq]),info:`<b>popBack()</b> → 彈出後端 <span class="hi">${v}</span>　deque = [${dq.join(', ')}]`,line:6});
      }
    }
    st.push({sprites:mkS([...dq]),info:`<b class="ok">完成！</b>最終 deque = [${dq.join(', ')}]。Deque 是滑動視窗問題的最佳資料結構`});
    return st;
  },
  code:`<span class="kw">class</span> <span class="fn">Deque</span> {
  <span class="fn">constructor</span>(){ <span class="kw">this</span>.items=[]; }
  <span class="fn">pushFront</span>(v){ <span class="kw">this</span>.items.unshift(v); }
  <span class="fn">popFront</span>() { <span class="kw">return this</span>.items.shift(); }
  <span class="fn">pushBack</span>(v) { <span class="kw">this</span>.items.push(v); }
  <span class="fn">popBack</span>()  { <span class="kw">return this</span>.items.pop(); }
  <span class="fn">peekFront</span>(){ <span class="kw">return this</span>.items[<span class="num">0</span>]; }
  <span class="fn">peekBack</span>() { <span class="kw">return this</span>.items.at(-<span class="num">1</span>); }
  <span class="fn">isEmpty</span>()  { <span class="kw">return</span> !<span class="kw">this</span>.items.length; }
}`,
  tips:{
    native:{
      code:`// JS Array 原生支援 Deque 的所有操作：

dq.pop();       // popBack   O(1)

    },
    cases:['滑動視窗最大值：O(n) 解法的核心','瀏覽器前進/後退：雙端操作歷史','回文判斷：從兩端同時取出比較','任務排程：高優先級插前端，一般插後端']
  }
};

// ══ PRIORITY QUEUE (Min-Heap) ════════════════════════════════
ALGOS.priorityQueue={
  title:'優先佇列 Priority Queue',
  desc:'不按插入順序，而是按「優先級」出列。最小優先佇列（Min-Heap）每次取出最小值，底層用二元堆積（Binary Heap）實作，插入和取出都是 O(log n)。陣列索引：父節點 i，左子 2i+1，右子 2i+2。',
  buildSteps(){
    const ops=[{insert:4},{insert:8},{insert:2},{insert:6},{insert:1},
               {extract:true},{insert:3},{extract:true}];
    const st=[];
    const heap=[];
    const NR=22;
    function mkTree(heap,hi=-1,newNode=-1){
      const spr={};
      const n=heap.length;
      if(n===0) return spr;
      // layout: level positions
      const positions=[];
      for(let i=0;i<n;i++){
        const level=Math.floor(Math.log2(i+1));
        const posInLevel=i-((1<<level)-1);
        const totalInLevel=1<<level;
        const x=CW()/2+(posInLevel-(totalInLevel-1)/2)*Math.min(80,CW()/(totalInLevel+0.5));
        const y=28+level*56;
        positions.push({x,y});

ALGOS.huffman={
  title:'霍夫曼樹 Huffman',
  desc:'無損壓縮演算法：高頻字元用短編碼，低頻字元用長編碼。步驟：① 統計頻率 ② 用 Min-Heap 建樹：每次取兩個最小節點合併 ③ 從樹根出發，左為0右為1，生成各字元的霍夫曼編碼。',
  buildSteps(){
    const freq={A:5,B:2,C:1,D:3,E:4};
    const st=[];
    const NR=20;
    function mkForest(nodes,highlight=[]){
      const spr={};
      if(nodes.length===0) return spr;
      const treeWidths=nodes.map(n=>Math.max(1,countLeaves(n)));
      const totalLeaves=treeWidths.reduce((a,b)=>a+b,0);
      const unitW=Math.min(44,Math.floor((CW()-16)/Math.max(totalLeaves,1)));
      let xOffset=8;
      nodes.forEach((tree,ti)=>{
        const leaves=treeWidths[ti];
        drawTree(spr,tree,xOffset+leaves*unitW/2,20,unitW,highlight,ti);
        xOffset+=leaves*unitW;
      });
      return spr;
    }
    function countLeaves(node){
      if(!node.left&&!node.right) return 1;
      return countLeaves(node.left)+countLeaves(node.right);
    }
    function drawTree(spr,node,x,y,unitW,highlight,prefix){
      if(!node) return;
      const id=`n_${prefix}_${x}_${y}`;
      const isHL=highlight.includes(node);
      const isLeaf=!node.left&&!node.right;
      spr[id]={type:'circle',x,y,r:NR,
        color:isHL?C.act:isLeaf?C.done:C.node,
        text:'',fs:12,z:2};
      // Separate labels so canvas doesn't show raw "\n"
      spr[id+'t']={type:'label',x,y:isLeaf?y-3:y+4,text:isLeaf?node.char:'',color:'#fff',font:'bold 11px sans-serif',align:'center',z:3};
      spr[id+'f']={type:'label',x,y:isLeaf?y+10:y+5,text:String(node.freq),color:'#e6edf3',font:isLeaf?'9px sans-serif':'bold 11px sans-serif',align:'center',z:3};
      if(node.left){
        const lLeaves=countLeaves(node.left);
        const lx=x-lLeaves*unitW/2;
        const ly=y+52;
        spr[`e${id}L`]={type:'edge',x1:x,y1:y+NR,x2:lx,y2:ly-NR,color:'#3fb950',z:1};
        spr[`e${id}L0`]={type:'label',x:(x+lx)/2-8,y:(y+ly)/2,text:'0',color:'#3fb950',font:'bold 11px sans-serif',align:'center',z:3};
        drawTree(spr,node.left,lx,ly,unitW,highlight,prefix);
      }
      if(node.right){
        const rLeaves=countLeaves(node.right);
        const rx=x+rLeaves*unitW/2;
        const ry=y+52;
        spr[`e${id}R`]={type:'edge',x1:x,y1:y+NR,x2:rx,y2:ry-NR,color:'#f85149',z:1};
        spr[`e${id}R1`]={type:'label',x:(x+rx)/2+8,y:(y+ry)/2,text:'1',color:'#f85149',font:'bold 11px sans-serif',align:'center',z:3};
        drawTree(spr,node.right,rx,ry,unitW,highlight,prefix);
      }
    }
    // Build priority queue (sorted array as simple heap)
    let nodes=Object.entries(freq).map(([char,f])=>({char,freq:f,left:null,right:null}));
    nodes.sort((a,b)=>a.freq-b.freq);
    st.push({sprites:mkForest([...nodes]),info:`<b>霍夫曼樹建立</b>：初始頻率 ${Object.entries(freq).map(([c,f])=>`${c}:${f}`).join(', ')}。每次合併兩個最小頻率節點`});
    while(nodes.length>1){
      nodes.sort((a,b)=>a.freq-b.freq);
      const a=nodes.shift(), b=nodes.shift();
      st.push({sprites:mkForest([...nodes,a,b],[a,b]),info:`取出最小兩節點：<span class="hi">${a.char||'合併'}(${a.freq})</span> 和 <span class="hi">${b.char||'合併'}(${b.freq})</span>，合併成新節點 freq=${a.freq+b.freq}`,line:4});
      const merged={char:'',freq:a.freq+b.freq,left:a,right:b};
      nodes.push(merged);
      st.push({sprites:mkForest([...nodes],[merged]),info:`新節點 freq=${merged.freq} 加入。剩餘 ${nodes.length} 個節點`});
    }
    // Generate codes
    const codes={};
    function genCodes(node,code=''){
      if(!node.left&&!node.right){codes[node.char]=code||'0';return;}
      if(node.left) genCodes(node.left,code+'0');
      if(node.right) genCodes(node.right,code+'1');
    }
    genCodes(nodes[0]);
    st.push({sprites:mkForest([...nodes]),info:`<b class="ok">霍夫曼樹完成！</b>編碼：${Object.entries(codes).map(([c,co])=>`${c}=${co}`).join('  ')}　高頻字元編碼更短`});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">huffman</span>(freq) {
  <span class="kw">let</span> nodes = Object.entries(freq)
    .map(([c,f])=>({char:c,freq:f,l:null,r:null}));
  <span class="kw">while</span>(nodes.length > <span class="num">1</span>){
    nodes.sort((a,b)=>a.freq-b.freq);
