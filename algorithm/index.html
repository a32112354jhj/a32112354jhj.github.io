// ══ AVL TREE ═════════════════════════════════════════════════
ALGOS.avl={
  title:'平衡樹 AVL Tree',
  desc:'自平衡二元搜尋樹：每個節點的左右子樹高度差（平衡因子）最多為 1。插入/刪除後若失衡，用旋轉操作（LL/RR/LR/RL）自動恢復平衡。保證搜尋/插入/刪除皆 O(log n)。',
  buildSteps(){
    const inserts=[10,20,30,15,25,5,3];
    const st=[];
    const NR=20;
    function height(n){return n?n.h:0;}
    function bf(n){return n?height(n.l)-height(n.r):0;}
    function upd(n){if(n) n.h=1+Math.max(height(n.l),height(n.r));}
    function rotR(y){
      const x=y.l,T=x.r;
      x.r=y; y.l=T; upd(y); upd(x); return x;
    }
    function rotL(x){
      const y=x.r,T=y.l;
      y.l=x; x.r=T; upd(x); upd(y); return y;
    }
    function insert(root,val){
      if(!root) return {val,l:null,r:null,h:1};
      if(val<root.val) root.l=insert(root.l,val);
      else root.r=insert(root.r,val);
      upd(root);
      const b=bf(root);
      if(b>1&&val<root.l.val) return rotR(root);
      if(b<-1&&val>root.r.val) return rotL(root);
      if(b>1&&val>root.l.val){root.l=rotL(root.l);return rotR(root);}
      if(b<-1&&val<root.r.val){root.r=rotR(root.r);return rotL(root);}
      return root;
    }
    function mkTree(root,hi=-1){
      const spr={};
      if(!root) return spr;
      function layout(node,x,y,spread){
        if(!node) return;
        const id=`n${node.val}`;
        spr[id]={type:'circle',x,y,r:NR,color:node.val===hi?C.act:C.done,text:String(node.val),fs:13,z:2,_fo:node.val===hi?0:undefined};
        const b=bf(node);
        spr[id+'b']={type:'label',x:x+NR+2,y:y-NR/2,text:`bf=${b}`,color:Math.abs(b)>1?'#f85149':'#8b949e',font:'9px sans-serif',align:'left',z:3};
        if(node.l){
          const lx=x-spread,ly=y+50;
          spr[`e${node.val}L`]={type:'edge',x1:x,y1:y+NR,x2:lx,y2:ly-NR,color:C.edge,z:1};
          layout(node.l,lx,ly,spread/2);
        }
        if(node.r){
          const rx=x+spread,ry=y+50;
          spr[`e${node.val}R`]={type:'edge',x1:x,y1:y+NR,x2:rx,y2:ry-NR,color:C.edge,z:1};
          layout(node.r,rx,ry,spread/2);
        }
      }
      layout(root,CW()/2,26,CW()/4);
      return spr;
    }
    let root=null;
    st.push({sprites:mkTree(null),info:'<b>AVL Tree</b>：每次插入後檢查平衡因子（bf = 左高-右高），|bf|>1 時執行旋轉',line:1});
    // Notes for steps that trigger rotations
    const rotNotes={30:'→ <span class="warn">bf=-2，RR 旋轉（左旋）</span>',

ALGOS.dijkstra={
  title:"最短路徑 Dijkstra",
  desc:'在有權重的圖中找從起點到所有節點的最短路徑。核心思想：貪心選擇——每次從未確定的節點中選「目前距離最短」的，更新其鄰居距離（Relaxation）。時間複雜度 O((V+E) log V)。',
  buildSteps(){
    const nodes=[0,1,2,3,4];
    const edges=[[0,1,4],[0,2,2],[1,2,1],[1,3,5],[2,3,8],[2,4,10],[3,4,2]];
    const st=[];
    const NR=20;
    // Node positions
    const pos=[{x:0.15,y:0.45},{x:0.38,y:0.18},{x:0.38,y:0.75},{x:0.70,y:0.25},{x:0.70,y:0.72}];
    function gp(i){return{x:Math.round(pos[i].x*(CW()-40)+20),y:Math.round(pos[i].y*(CH-40)+20)};}
    function mkG(dist,visited,current=-1,relaxing=-1){
      const spr={};
      edges.forEach(([a,b,w],i)=>{
        const pa=gp(a),pb=gp(b);
        const isRelax=(a===current&&b===relaxing)||(b===current&&a===relaxing);
        spr[`e${i}`]={type:'edge',x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y,color:isRelax?C.act:C.edge,lw:isRelax?2.5:1.5,z:0};
        const mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;
        spr[`ew${i}`]={type:'label',x:mx,y:my-5,text:String(w),color:isRelax?C.act:'#8b949e',font:'bold 11px sans-serif',align:'center',z:3};
      });
      nodes.forEach(n=>{
        const {x,y}=gp(n);
        const vis=visited.has(n);
        const isCur=n===current;
        spr[`nd${n}`]={type:'circle',x,y,r:NR,color:isCur?C.act:vis?C.done:C.node,text:String(n),fs:13,z:2};
        const d=dist[n];
        spr[`dt${n}`]={type:'label',x,y:y-NR-5,text:d===Infinity?'∞':String(d),color:isCur?C.act:vis?C.done:'#e6edf3',font:'bold 12px sans-serif',align:'center',z:3};
      });
      return spr;
    }
    const INF=Infinity;
    const dist=Array(5).fill(INF); dist[0]=0;
    const visited=new Set();
    const prev=Array(5).fill(-1);
    st.push({sprites:mkG(dist,visited),info:'<b>Dijkstra</b>：從節點 0 出發。dist[0]=0，其餘 ∞。每輪選取距離最小的未確定節點',line:1});
    while(visited.size<5){
      // Pick min dist unvisited
      let u=-1;
      for(let i=0;i<5;i++) if(!visited.has(i)&&(u===-1||dist[i]<dist[u])) u=i;
      if(dist[u]===INF) break;
      visited.add(u);
      st.push({sprites:mkG(dist,visited,u),info:`選取距離最小的節點 <span class="hi">${u}</span>（dist=${dist[u]}），標記為已確定`,line:4});
      // Relax neighbors
      for(const [a,b,w] of edges){
        const nb=a===u?b:b===u?a:-1;
        if(nb===-1||visited.has(nb)) continue;
        if(dist[u]+w<dist[nb]){
          st.push({sprites:mkG(dist,visited,u,nb),info:`Relaxation：dist[${nb}] = min(${dist[nb]===INF?'∞':dist[nb]}, dist[${u}]+${w}=${dist[u]+w}) → <span class="ok">${dist[u]+w}</span>`,line:6});
          dist[nb]=dist[u]+w; prev[nb]=u;
        }
      }
    }
    st.push({sprites:mkG(dist,visited),info:`<b class="ok">完成！</b>從節點 0 出發的最短距離：${dist.map((d,i)=>`→${i}:${d}`).join('  ')}`});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">dijkstra</span>(graph, src) {
  <span class="kw">const</span> dist = <span class="kw">new</span> Array(graph.length).fill(Infinity);
  <span class="kw">const</span> visited = <span class="kw">new</span> Set();
  dist[src] = <span class="num">0</span>;
  <span class="kw">while</span>(visited.size < graph.length) {
    <span class="cm">// 取未訪問中距離最小者</span>
    <span class="kw">const</span> u = [...dist.keys()]
      .filter(i=>!visited.has(i))
      .reduce((a,b)=>dist[a]&lt;dist[b]?a:b);
    <span class="kw">if</span>(dist[u]===Infinity) <span class="kw">break</span>;
    visited.add(u);
    <span class="cm">// Relaxation：更新鄰居距離</span>
    <span class="kw">for</span>(<span class="kw">const</span> [v,w] <span class="kw">of</span> graph[u])
      <span class="kw">if</span>(dist[u]+w < dist[v]) dist[v]=dist[u]+w;
  }
  <span class="kw">return</span> dist;
}`,
  tips:{
    native:{
      code:`// 配合 Min-Heap 效率更高：O((V+E) log V)
// 簡單版（稠密圖）：O(V²)

// 有負權重 → 用 Bellman-Ford 演算法`,
      note:`Dijkstra 是最重要的圖演算法之一。搭配 Min-Heap（優先佇列）可達 O((V+E) log V)。<b>負權重邊</b>需改用 Bellman-Ford；更快的稠密圖用 Johnson 演算法。`
    },
    cases:['Google Maps / Apple Maps：路網最短路徑計算','網路路由：OSPF 協議用 Dijkstra 計算路由表','遊戲 AI：NPC 在地圖上的最短路徑尋路','社群網路：六度分隔理論的最短連接計算']
  }
};

// ══ SPANNING TREE (Kruskal) ═══════════════════════════════════
ALGOS.spanningTree={
  title:'擴張樹 Spanning Tree',
  desc:"最小生成樹（MST）：連接圖中所有節點，且邊的總權重最小的樹。Kruskal 演算法：將所有邊按權重排序，依序加入，若不形成環則加入（用 Union-Find 判斷是否成環）。時間 O(E log E)。",
  buildSteps(){
    const N=5;
    const edges=[[0,1,4],[0,2,3],[1,2,1],[1,3,6],[2,3,2],[2,4,5],[3,4,7]];
    const pos=[{x:.15,y:.45},{x:.38,y:.18},{x:.38,y:.75},{x:.72,y:.25},{x:.72,y:.72}];
    const st=[];
    function gp(i){return{x:Math.round(pos[i].x*(CW()-40)+20),y:Math.round(pos[i].y*(CH-40)+20)};}
    const parent=Array.from({length:N},(_,i)=>i);
    function find(x){return parent[x]===x?x:(parent[x]=find(parent[x]));}
    function union(a,b){parent[find(a)]=find(b); return true;}
    function mkG(mst,active=-1,rejected=-1){
      const spr={};
      edges.forEach(([a,b,w],i)=>{
        const pa=gp(a),pb=gp(b);
        const inMST=mst.includes(i);
        const isAct=i===active, isRej=i===rejected;
        spr[`e${i}`]={type:'edge',x1:pa.x,y1:pa.y,x2:pb.x,y2:pb.y,
          color:isAct?C.act:isRej?C.swap:inMST?C.done:C.edge,lw:inMST||isAct?3:1.5,z:0};
        spr[`ew${i}`]={type:'label',x:(pa.x+pb.x)/2,y:(pa.y+pb.y)/2-6,text:String(w),
          color:isAct?C.act:isRej?C.swap:inMST?C.done:'#8b949e',font:'bold 11px sans-serif',align:'center',z:3};
      });
      for(let n=0;n<N;n++){
        const {x,y}=gp(n);
        spr[`nd${n}`]={type:'circle',x,y,r:20,color:C.node,text:String(n),fs:14,z:2};
      }
      return spr;
    }
    const sortedEdges=edges.map((e,i)=>[...e,i]).sort((a,b)=>a[2]-b[2]);
    const mst=[];
    let totalW=0;
    st.push({sprites:mkG([]),info:`<b>Kruskal MST</b>：將 ${edges.length} 條邊按權重排序：${sortedEdges.map(e=>`(${e[0]}-${e[1]}:${e[2]})`).join(' ')}`,line:1});
    for(const [a,b,w,idx] of sortedEdges){
      const fa=find(a),fb=find(b);
      if(fa===fb){
        st.push({sprites:mkG([...mst],idx,-1),info:`邊 ${a}-${b}(w=${w})：<span class="err">形成環！跳過</span>（${a} 和 ${b} 已連通，find(${a})=find(${b})=${fa}）`,line:5});
        continue;
      }
      st.push({sprites:mkG([...mst],idx,-1),info:`邊 ${a}-${b}(w=${w})：<span class="ok">加入 MST！</span>不形成環，union(${a},${b})`,line:4});
      union(a,b);
      mst.push(idx);
      totalW+=w;
      st.push({sprites:mkG([...mst]),info:`MST 已有 ${mst.length} 條邊，總權重 = ${totalW}。還需 ${N-1-mst.length} 條`});
      if(mst.length===N-1) break;
    }
    st.push({sprites:mkG([...mst]),info:`<b class="ok">最小生成樹完成！</b>共 ${N-1} 條邊，總權重 <span class="ok">${totalW}</span>`});
    return st;
  },
  code:`<span class="cm">// Kruskal + Union-Find</span>
<span class="kw">function</span> <span class="fn">kruskal</span>(n, edges) {
  <span class="kw">const</span> parent=[...Array(n).keys()];
  <span class="kw">const</span> find=x=>parent[x]===x?x:(parent[x]=<span class="fn">find</span>(parent[x]));
  <span class="kw">const</span> union=(a,b)=>{parent[<span class="fn">find</span>(a)]=<span class="fn">find</span>(b);};
  <span class="kw">return</span> edges
    .sort((a,b)=>a[<span class="num">2</span>]-b[<span class="num">2</span>]) <span class="cm">// 按權重排序</span>
    .filter(([a,b,w])=>{
      <span class="kw">if</span>(<span class="fn">find</span>(a)===<span class="fn">find</span>(b)) <span class="kw">return false</span>; <span class="cm">// 成環跳過</span>
      <span class="fn">union</span>(a,b); <span class="kw">return true</span>;
    });
}`,
  tips:{
    native:{
      code:`// Prim 演算法（另一種 MST）：從節點出發，每次加最小邊
// Kruskal 適合稀疏圖（邊少）
// Prim 適合稠密圖（邊多）
// 兩者都能得到相同的最小生成樹`,
      note:`MST 是圖論基礎。<b>Union-Find（並查集）</b>是 Kruskal 的核心：O(α(n)) 幾乎 O(1) 的連通性查詢。`
    },
    cases:['電路板佈線：最小化電線總長度','城市水管/電網設計：最小成本連接所有地點','叢集分析：刪除最大權重邊，剩下 k 棵樹','圖像分割：像素間權重為相似度']
  }
};

          const isMoving=d===diskV&&(p===from||p===to);
          spr[`disk${p}_${d}`]={type:'rect',x:px-w/2,y,w,h:DISK_H-2,color:COLORS[d-1]||C.bar,

    }
    const moves=[];
    function hanoi(n,from,to,via){
      if(n===0) return;

// ══ N-QUEENS ══════════════════════════════════════════════════
ALGOS.nQueens={
  title:'N 皇后 N-Queens',
  desc:'在 N×N 棋盤上放 N 個皇后，使任兩個皇后不在同一行、列或對角線上。用回溯法逐行放置，放不下就退回上一行換位置。此例示範 5 皇后，共有 10 種解法。',
  buildSteps(){
    const N=5;
    const st=[];
    const CELL=Math.min(34,Math.floor((CW()-20)/N));
    const SX=Math.floor((CW()-N*CELL)/2);
    const SY=10;
    function mkGrid(queens,cur=-1,conflict=-1){
      const spr={};
      // Build attack set for conflict display
      const attacked=new Set();
      if(conflict>=0&&queens[conflict]>=0){
        const qc=queens[conflict];
        for(let r=0;r<N;r++){
          attacked.add(`${r}_${qc}`);           // same column
          const d=Math.abs(r-conflict);
          if(qc-d>=0) attacked.add(`${r}_${qc-d}`);  // diagonals
          if(qc+d<N)  attacked.add(`${r}_${qc+d}`);
        }
      }
      for(let r=0;r<N;r++){
        for(let c=0;c<N;c++){
          const x=SX+c*CELL,y=SY+r*CELL;
          const hasQ=queens[r]===c;
          const isCur=r===cur&&c===queens[cur];
          const isConf=r===conflict&&hasQ;
          const isAttack=conflict>=0&&attacked.has(`${r}_${c}`)&&!hasQ;
          const isDark=(r+c)%2===0;
          spr[`cell${r}_${c}`]={type:'rect',x,y,w:CELL-1,h:CELL-1,
            color:isConf?'#3a1a1a':isAttack?'rgba(248,81,73,0.12)':isCur?'#1a3a2a':isDark?'#1c2128':'#242c3a',z:0};
          if(hasQ){
            spr[`q${r}`]={type:'label',x:x+CELL/2,y:y+CELL/2+5,text:'♛',
              color:isConf?C.swap:isCur?C.done:C.act,font:`${CELL-6}px sans-serif`,align:'center',z:2};
          }
        }
      }
      // Show step counter and row labels
      spr['info_row']={type:'label',x:SX-4,y:SY+N*CELL+14,text:`${queens.filter(q=>q>=0).length} / ${N} 皇后已放置`,color:'#8b949e',font:'11px sans-serif',align:'left',z:0};
      return spr;
    }
    function isSafe(queens,row,col){
      for(let r=0;r<row;r++){
        if(queens[r]===col) return false;
        if(Math.abs(queens[r]-col)===Math.abs(r-row)) return false;
      }
      return true;
    }
    const queens=Array(N).fill(-1);
    let solutionCount=0;
    st.push({sprites:mkGrid(queens),info:`<b>N 皇后（N=${N}）</b>：逐行放置，遇衝突回溯。皇后不可同行/列/對角線`,line:1});
    function solve(row){
      if(solutionCount>=2) return; // show first 2 solutions
      if(row===N){
        solutionCount++;
        st.push({sprites:mkGrid([...queens]),info:`<span class="ok">找到第 ${solutionCount} 個解！</span>[${queens.join(',')}]　繼續回溯尋找更多解`,line:3});
        return;
      }
      for(let col=0;col<N;col++){
        if(isSafe(queens,row,col)){
          queens[row]=col;
          st.push({sprites:mkGrid([...queens],row),info:`第 ${row} 行，放在第 ${col} 列 ✓ 安全，繼續下一行`,line:5});
          solve(row+1);
          if(solutionCount>=2) return;
          queens[row]=-1;
          st.push({sprites:mkGrid([...queens]),info:`<span class="warn">回溯！</span>撤銷第 ${row} 行第 ${col} 列，嘗試下一個位置`,line:7});
        } else {
          queens[row]=col;
          st.push({sprites:mkGrid([...queens],row,row),info:`第 ${row} 行第 ${col} 列 ✗ <span class="err">衝突</span>，跳過`,line:6});
          queens[row]=-1;
        }
      }
    }
    solve(0);
    st.push({sprites:mkGrid(queens),info:`<b class="ok">展示完畢！</b>5 皇后共有 <b>10</b> 種解法。8 皇后有 92 種`});
    return st;
  },
  code:`<span class="kw">function</span> <span class="fn">nQueens</span>(n) {
  <span class="kw">const</span> result=[], queens=[];
  <span class="kw">function</span> <span class="fn">bt</span>(row) {
    <span class="kw">if</span>(row===n){ result.push([...queens]); <span class="kw">return</span>; }
    <span class="kw">for</span>(<span class="kw">let</span> col=<span class="num">0</span>; col&lt;n; col++){
      <span class="kw">if</span>(<span class="fn">isSafe</span>(queens,row,col)){
        queens[row]=col;
        <span class="fn">bt</span>(row+<span class="num">1</span>);
        queens[row]=-<span class="num">1</span>; <span class="cm">// 回溯</span>
      }
    }
  }
  <span class="fn">bt</span>(<span class="num">0</span>); <span class="kw">return</span> result;
}
<span class="fn">nQueens</span>(<span class="num">5</span>).length; <span class="cm">// → 10 種解</span>`,
  tips:{
    native:{
      code:`// 位元運算優化：用 bitmask 追蹤列/對角線衝突
// 比陣列版快 ~10 倍
function nQueensBit(n) {
  let count = 0;
  const bt = (row, cols, d1, d2) => {
    if(row===n){count++;return;}
    let avail=((1<<n)-1)&~(cols|d1|d2);
    while(avail){const bit=avail&-avail; avail-=bit; bt(row+1,cols|bit,(d1|bit)<<1,(d2|bit)>>1);}
  };
  bt(0,0,0,0); return count;
}`,
      note:`N 皇后是回溯法的經典題。<b>位元運算版</b>用三個整數的位元追蹤攻擊位置，比陣列版快約 10 倍。8 皇后有 92 解，16 皇后有 14,772,512 解。`
    },
    cases:['約束滿足問題（CSP）的典型範例','平行計算：不同行的搜尋可獨立進行','測試框架中的排列組合生成','密碼學：某些金鑰排列問題']
  }
};

// ══ HASH ALGORITHM ════════════════════════════════════════════
ALGOS.hashAlgo={
  title:'雜湊演算法 Hash Algo',
  desc:'將任意長度的輸入轉換為固定長度的「指紋」（Hash）。核心特性：① 確定性（相同輸入永遠相同輸出）② 雪崩效應（輸入微小改變導致輸出巨大改變）③ 不可逆（無法從 Hash 反推輸入）。此例示範 djb2 雜湊。',
  buildSteps(){
    const inputs=['cat','hat','bat'];
    const st=[];
    const TABLESIZE=8;
    function djb2(str){
      let hash=5381;
      for(const c of str) hash=((hash<<5)+hash)^c.charCodeAt(0);
      return Math.abs(hash)%TABLESIZE;
    }
    function mkS(cur='',chars=[],hashVal=-1,table={}){
      const spr={};
      // Hash table slots
      const SW=Math.floor((CW()-20)/TABLESIZE);
      for(let i=0;i<TABLESIZE;i++){
        const x=10+i*SW;
        const entries=table[i]||[];
        spr[`slot${i}`]={type:'rect',x:x+1,y:CH-60,w:SW-2,h:36,
          color:hashVal===i?C.act:entries.length?'#1a3a2a':C.node,text:String(i),font:'10px sans-serif',z:1};
        entries.forEach((e,j)=>{
          spr[`entry${i}_${j}`]={type:'label',x:x+SW/2,y:CH-60-16-j*16,text:e,color:C.done,font:'bold 11px sans-serif',align:'center',z:2};
        });
      }
      spr['tblbl']={type:'label',x:CW()/2,y:CH-25,text:'雜湊表（桶 0~7）',color:'#8b949e',font:'10px sans-serif',align:'center',z:0};
      // Current word processing
      if(cur){
        const BW=22,BH=26,GAP=3;
        const n=cur.length;
        const sx=Math.floor((CW()-(n*(BW+GAP)))/2);
        [...cur].forEach((c,i)=>{
          spr[`cc${i}`]={type:'rect',x:sx+i*(BW+GAP),y:12,w:BW,h:BH,
            // chars.length = number processed; done=past, active=latest, bar=pending
            color:i<chars.length-1?C.done:i===chars.length-1?C.act:C.bar,
            text:c,font:'bold 13px sans-serif',z:2};
        });
        spr['hashlbl']={type:'label',x:CW()/2,y:52,text:`hash = ${chars.length>0?chars[chars.length-1]:'5381'}`,color:'#58a6ff',font:'bold 13px sans-serif',align:'center',z:3};
        if(chars.length>0){
          // cur[chars.length-1] = the char just processed
          spr['formula']={type:'label',x:CW()/2,y:68,text:`(hash<<5)+hash XOR '${cur[chars.length-1]}'(${cur.charCodeAt(chars.length-1)})`,color:'#8b949e',font:'10px sans-serif',align:'center',z:3};
        }
      }
      if(hashVal>=0){
        spr['result']={type:'label',x:CW()/2,y:84,text:`→ 桶 #${hashVal}`,color:C.done,font:'bold 14px sans-serif',align:'center',z:4};
      }
      return spr;
    }
    const table={};
    st.push({sprites:mkS(),info:'<b>djb2 雜湊演算法</b>：初始值 5381，對每個字元執行 hash=(hash×33)⊕charCode，最後 mod 桶數',line:1});
    for(const word of inputs){
      let hash=5381;
      const trace=[];          // 不含初始值，長度 = 已處理字元數
      let prevHash=5381;
      st.push({sprites:mkS(word,[],{}),info:`雜湊 "<span class="hi">${word}</span>"：初始 hash=5381`,line:2});
      for(let i=0;i<word.length;i++){
        const c=word[i],code=c.charCodeAt(0);
        hash=Math.abs(((prevHash<<5)+prevHash)^code);
        prevHash=hash;
        trace.push(hash);
        // chars.length = i+1 → done: i<i active: i===i
        st.push({sprites:mkS(word,trace.map(String)),info:`字元 '${c}'(${code})：(${i===0?5381:trace[i-1]}×33) XOR ${code} = <span class="hi">${hash}</span>`,line:3});
      }
      const bucket=hash%TABLESIZE;
      st.push({sprites:mkS(word,trace.map(String),bucket,{...table}),info:`${hash} mod ${TABLESIZE} = <b>${bucket}</b>　"${word}" 存入桶 <span class="ok">#${bucket}</span>`,line:5});
      if(!table[bucket]) table[bucket]=[];
      table[bucket].push(word);
      st.push({sprites:mkS('',[], bucket,{...table}),info:`"<span class="ok">${word}</span>" 已存入桶 #${bucket}　（碰撞時用鏈結串列串接）`});
    }
    st.push({sprites:mkS('',[],-1,{...table}),info:`<b class="ok">完成！</b>三個字詞各自雜湊到不同桶。好的雜湊函式讓分布均勻，減少碰撞`});
    return st;
  },
  code:`<span class="cm">// djb2 雜湊函式</span>
<span class="kw">function</span> <span class="fn">hash</span>(str, size=<span class="num">53</span>) {
  <span class="kw">let</span> h = <span class="num">5381</span>;
  <span class="kw">for</span> (<span class="kw">const</span> c <span class="kw">of</span> str)
    h = ((h << <span class="num">5</span>) + h) ^ c.charCodeAt(<span class="num">0</span>);
  <span class="kw">return</span> Math.abs(h) % size;
}
<span class="fn">hash</span>(<span class="str">'cat'</span>);  <span class="cm">// → 某個桶位置</span>

<span class="cm">// MD5/SHA256 也基於類似原理但更複雜</span>`,
