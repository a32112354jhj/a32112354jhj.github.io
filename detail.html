<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能文件</title>
<style>
  :root{
    --bg:#0d1117; --bg-soft:#161b22; --line:#30363d;
    --text:#e6edf3; --text-dim:#8b949e; --card:#1c2128; --ok:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 50% -10%,#1b2430 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;
  }
  .topbar{border-bottom:1px solid var(--line);background:rgba(13,17,23,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:10;}
  .topbar a{display:inline-block;padding:16px 24px;color:var(--text-dim);text-decoration:none;font-size:14px;}
  .topbar a:hover{color:var(--text);}
  .wrap{max-width:760px;margin:0 auto;padding:40px 24px 90px;}

  .hero{display:flex;align-items:center;gap:18px;margin-bottom:8px;}
  .ic{border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#0d1117;border:1px solid var(--line);overflow:hidden;}
  .ic-emoji{border-style:dashed;color:var(--text-dim);}
  .hero h1{font-size:30px;}
  .tags{margin:14px 0 26px;display:flex;gap:8px;flex-wrap:wrap;}
  .tag{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--line);color:var(--text-dim);}
  .lv-1{color:#7ee787;} .lv-2{color:#d29922;} .lv-3{color:#f85149;}

  section{margin-bottom:34px;}
  section h2{font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;border-left:3px solid var(--line);padding-left:10px;display:flex;justify-content:space-between;align-items:center;}
  .lead{font-size:17px;line-height:1.8;}

  /* 自我檢核 todolist */
  .progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .bar{flex:1;height:8px;background:#0d1117;border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fb950,#7ee787);transition:width .3s;}
  .progress-text{font-size:13px;color:var(--text-dim);white-space:nowrap;}
  ul.todo{list-style:none;display:grid;gap:10px;}
  ul.todo li{background:var(--card);border:1px solid var(--line);border-radius:10px;transition:.16s;}
  ul.todo li.done{border-color:rgba(63,185,80,.5);background:rgba(63,185,80,.06);}
  ul.todo label{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;cursor:pointer;font-size:15px;line-height:1.5;}
  ul.todo input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:0 0 auto;margin-top:1px;border:2px solid var(--line);border-radius:6px;cursor:pointer;position:relative;transition:.16s;}
  ul.todo input:checked{background:var(--ok);border-color:var(--ok);}
  ul.todo input:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#0d1117;font-size:13px;font-weight:900;}
  ul.todo li.done label span{color:var(--text-dim);text-decoration:line-through;}
  .reset-btn{background:none;border:1px solid var(--line);color:var(--text-dim);font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;text-transform:none;letter-spacing:0;}
  .reset-btn:hover{color:var(--text);border-color:var(--text-dim);}

  ul.points{list-style:none;display:grid;gap:10px;}
  ul.points li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:15px;display:flex;gap:10px;align-items:center;}
  ul.points li::before{content:"▹";color:var(--text-dim);}

  ul.links{list-style:none;display:grid;gap:10px;}
  ul.links li a{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:15px;text-decoration:none;color:var(--text);transition:.18s;}
  ul.links li a:hover{border-color:#58a6ff;background:#1b2430;}
  ul.links .lk-host{margin-left:auto;font-size:12px;color:var(--text-dim);}

  .subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .subgrid a{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;text-decoration:none;color:var(--text);font-size:14px;transition:.16s;}
  .subgrid a:hover{border-color:var(--text-dim);transform:translateY(-2px);}
  .subgrid .go{margin-left:auto;color:var(--text-dim);font-size:12px;}

  .doc{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--text-dim);line-height:1.8;font-size:14px;}
  .doc strong{color:var(--text);} .doc code{background:#0d1117;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px;color:#e6edf3;}

  .nav-links{display:flex;justify-content:space-between;margin-top:40px;gap:12px;}
  .nav-links a{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--text);font-size:13px;transition:.18s;}
  .nav-links a:hover{border-color:var(--text-dim);}
  .nav-links .nl-label{color:var(--text-dim);font-size:11px;display:block;margin-bottom:3px;}
  .nav-links a.next{text-align:right;}
  .empty{text-align:center;padding:80px 20px;color:var(--text-dim);}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← 回技能樹</a></div>
<div class="wrap" id="wrap"></div>

<script src="skills-data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const found = id ? window.SKILL_FIND(id) : null;
  const wrap = document.getElementById("wrap");

  function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } }

  if (!found) {
    document.title = "找不到技能";
    wrap.innerHTML = `<div class="empty"><h1>🔍 找不到這個技能</h1><p style="margin-top:12px"><a href="index.html" style="color:#58a6ff">回到技能樹</a></p></div>`;
  } else {
    const { skill, col, isChild, parent } = found;
    document.title = skill.name + "｜技能檢核";

    // 標籤
    let tagsHtml = `<span class="tag">${col.title}</span>`;
    if (isChild) {
      tagsHtml += `<span class="tag">${parent.name} 的細項技術</span>`;
    } else {
      tagsHtml += `<span class="tag lv-${skill.level}">${window.LV_TEXT[skill.level]}</span>`;
    }

    // 自我檢核 todolist
    const cl = skill.checklist || [];
    const todoHtml = cl.map((t,i) => `
      <li data-i="${i}">
        <label><input type="checkbox" data-i="${i}"><span>${t}</span></label>
      </li>`).join("");

    // 簡介
    const descHtml = skill.desc
      ? `<section><h2>技能簡介</h2><p class="lead">${skill.desc}</p></section>` : "";

    // 學習重點（主技能才有）
    const pointsHtml = (skill.points && skill.points.length)
      ? `<section><h2>學習重點</h2><ul class="points">${skill.points.map(p=>`<li>${p}</li>`).join("")}</ul></section>` : "";

    // 子項目（主技能才有）
    const childrenHtml = (skill.children && skill.children.length)
      ? `<section><h2>細項技術（各有獨立檢核）</h2><div class="subgrid">${
          skill.children.map(c=>`<a href="detail.html?id=${c.id}">${window.SKILL_ICON(c,24)}<span>${c.name}</span><span class="go">›</span></a>`).join("")
        }</div></section>` : "";

    // 參考資源
    let refHtml = "";
    if (isChild && skill.url) {
      refHtml = `<section><h2>官方網站</h2><ul class="links"><li><a href="${skill.url}" target="_blank" rel="noopener">🔗 <span>${skill.name} 官方網站</span><span class="lk-host">${host(skill.url)} ↗</span></a></li></ul></section>`;
    } else if (skill.links && skill.links.length) {
      refHtml = `<section><h2>參考資源 / 文件連結</h2><ul class="links">${
        skill.links.map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener">🔗 <span>${l.label}</span><span class="lk-host">${host(l.url)} ↗</span></a></li>`).join("")
      }</ul></section>`;
    }

    // 上一個 / 下一個（主技能用同領域；子項目用同父）
    const sibs = isChild ? parent.children : col.skills;
    const idx = sibs.findIndex(s => s.id === skill.id);
    const prev = sibs[idx-1], next = sibs[idx+1];
    const navHtml = `
      ${prev ? `<a href="detail.html?id=${prev.id}"><span class="nl-label">← 上一個</span>${prev.name}</a>` : `<a style="visibility:hidden"></a>`}
      ${next ? `<a class="next" href="detail.html?id=${next.id}"><span class="nl-label">下一個 →</span>${next.name}</a>` : `<a class="next" style="visibility:hidden"></a>`}`;

    wrap.innerHTML = `
      <div class="hero">${window.SKILL_ICON(skill, 64)}<h1>${skill.name}</h1></div>
      <div class="tags">${tagsHtml}</div>
      ${descHtml}
      <section>
        <h2>學完自我檢核（${cl.length} 項）
          <button class="reset-btn" id="resetBtn">清除勾選</button>
        </h2>
        <div class="progress-wrap">
          <div class="bar"><i id="barFill"></i></div>
          <span class="progress-text" id="progText"></span>
        </div>
        <ul class="todo" id="todo">${todoHtml}</ul>
      </section>
      ${pointsHtml}
      ${childrenHtml}
      ${refHtml}
      <section>
        <h2>技術文件</h2>
        <div class="doc">📄 <strong>${skill.name} 技術文件區（預留）。</strong><br><br>
          未來可在 <code>skills-data.js</code> 對應技能加上 <code>doc</code> 欄位填入完整教學、範例與最佳實踐。</div>
      </section>
      <div class="nav-links">${navHtml}</div>`;

    // ===== 自我檢核：localStorage 記住進度 =====
    const storeKey = "skilltree_check_" + skill.id;
    const saved = JSON.parse(localStorage.getItem(storeKey) || "[]");
    const boxes = Array.from(document.querySelectorAll("#todo input"));
    const barFill = document.getElementById("barFill");
    const progText = document.getElementById("progText");

    function refresh(){
      let done = 0;
      boxes.forEach(b => {
        const li = b.closest("li");
        if (b.checked){ done++; li.classList.add("done"); } else li.classList.remove("done");
      });
      const pct = boxes.length ? Math.round(done/boxes.length*100) : 0;
      barFill.style.width = pct + "%";
      progText.textContent = `${done} / ${boxes.length} 完成（${pct}%）`;
    }
    function save(){ localStorage.setItem(storeKey, JSON.stringify(boxes.map(b=>b.checked))); }

    boxes.forEach((b,i) => {
      b.checked = !!saved[i];
      b.addEventListener("change", () => { save(); refresh(); });
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      boxes.forEach(b => b.checked = false); save(); refresh();
    });
    refresh();
  }
</script>
</body>
</html>
