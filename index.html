<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全端工程師技能樹</title>
<style>
  :root{
    --bg:#0d1117; --bg-soft:#161b22; --line:#30363d; --conn:#3a4452;
    --text:#e6edf3; --text-dim:#8b949e; --card:#1c2128;
    --fe:#58a6ff; --be:#3fb950; --ai:#bc8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 50% -10%,#1b2430 0%,var(--bg) 55%);
    color:var(--text);min-height:100vh;padding:32px 0 80px;
  }
  header{text-align:center;margin-bottom:8px;padding:0 20px;}
  header h1{font-size:30px;letter-spacing:1px;}
  header p{color:var(--text-dim);margin-top:8px;font-size:14px;}
  .nav-links{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  .nav-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--text);transition:.16s;}
  .nav-btn:hover{border-color:var(--fe);color:var(--fe);box-shadow:0 0 16px rgba(88,166,255,.15);transform:translateY(-1px);}

  .legend{display:flex;gap:18px;justify-content:center;margin:22px 0 10px;flex-wrap:wrap;font-size:13px;color:var(--text-dim);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .hint{text-align:center;color:var(--text-dim);font-size:12px;margin-bottom:18px;}

  /* ===== 橫排族譜樹 ===== */
  .treewrap{overflow-x:auto;padding:24px 30px 50px;}
  .tree{display:inline-block;min-width:100%;text-align:center;}
  .tree ul{position:relative;padding-top:28px;display:flex;justify-content:center;}
  .tree li{list-style:none;position:relative;padding:28px 12px 0;display:flex;flex-direction:column;align-items:center;}
  /* 連接線 */
  .tree li::before,.tree li::after{content:"";position:absolute;top:0;width:50%;height:28px;border-top:2px solid var(--conn);}
  .tree li::before{right:50%;}
  .tree li::after{left:50%;border-left:2px solid var(--conn);}
  .tree li:only-child::before,.tree li:only-child::after{display:none;}
  .tree li:only-child{padding-top:28px;}
  .tree li:first-child::before,.tree li:last-child::after{border:0 none;}
  .tree li:last-child::before{border-right:2px solid var(--conn);border-radius:0 6px 0 0;}
  .tree li:first-child::after{border-radius:6px 0 0 0;}
  .tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--conn);width:0;height:28px;}

  /* 單行節點（根 / 領域） */
  .pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:14px;color:var(--text);white-space:nowrap;}
  .root{font-size:17px;font-weight:700;padding:13px 22px;background:var(--bg-soft);border-color:#444c56;box-shadow:0 0 24px rgba(88,166,255,.12);}
  .domain{font-weight:700;font-size:15px;letter-spacing:1px;}
  .domain.fe{color:var(--fe);border-color:rgba(88,166,255,.5);}
  .domain.be{color:var(--be);border-color:rgba(63,185,80,.5);}
  .domain.ai{color:var(--ai);border-color:rgba(188,140,255,.5);}

  /* 技能卡（上半=技能；下半=細項技術） */
  .card{display:inline-flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:124px;max-width:178px;position:relative;transition:.16s;}
  .card:hover{box-shadow:0 8px 20px rgba(0,0,0,.45);transform:translateY(-2px);}
  .card .lvdot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;}
  .lv-1 .lvdot{background:#7ee787;} .lv-2 .lvdot{background:#d29922;} .lv-3 .lvdot{background:#f85149;}
  .card-head{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);padding-right:10px;}
  .card-head .nm{font-size:13px;font-weight:600;text-align:left;line-height:1.3;}
  .card-head .arrow{margin-left:auto;color:var(--text-dim);font-size:12px;}
  .fe .card:hover{border-color:var(--fe);} .be .card:hover{border-color:var(--be);} .ai .card:hover{border-color:var(--ai);}

  .variants{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;border-top:1px dashed var(--line);padding-top:7px;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim);text-decoration:none;background:#0d1117;border:1px solid var(--line);border-radius:20px;padding:3px 8px;transition:.16s;}
  .chip:hover{color:var(--text);border-color:var(--text-dim);}

  .ic{border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#0d1117;border:1px solid var(--line);overflow:hidden;}
  .ic-emoji{border-style:dashed;color:var(--text-dim);}

  /* ===== RWD ===== */
  @media(max-width:600px){
    body{padding:20px 0 60px;}
    header h1{font-size:22px;}
    header p{font-size:12px;}
    .nav-btn{padding:6px 12px;font-size:12px;}
    .legend{gap:10px;font-size:12px;}
    .hint{font-size:11px;margin-bottom:12px;}
    .treewrap{padding:16px 12px 40px;}
    .tree li{padding:20px 6px 0;}
    .pill{padding:8px 12px;font-size:13px;}
    .root{font-size:15px;padding:10px 16px;}
    .domain{font-size:13px;}
    .card{min-width:100px;max-width:148px;padding:8px 10px;}
    .card .card-head .nm{font-size:12px;}
    .chip{font-size:10px;padding:2px 6px;}
  }
</style>
</head>
<body>
<header>
  <h1>🌳 全端工程師技能樹</h1>
  <p>基礎技能在上，往下延伸進階技能（如 CSS → CSS 工具、JS → TS → 框架）</p>
  <div class="nav-links">
    <a class="nav-btn" href="algorithm/index.html">🧮 演算法視覺化 →</a>
  </div>
</header>

<div class="legend">
  <span><i class="dot" style="background:var(--fe)"></i>前端</span>
  <span><i class="dot" style="background:var(--be)"></i>後端</span>
  <span><i class="dot" style="background:var(--ai)"></i>AI 輔助開發</span>
  <span><i class="dot" style="background:#7ee787"></i>入門</span>
  <span><i class="dot" style="background:#d29922"></i>中階</span>
  <span><i class="dot" style="background:#f85149"></i>進階</span>
</div>
<div class="hint">← 可左右捲動　·　每個技能與細項技術都有獨立頁，內含 6 項學完自我檢核表 ✓</div>

<div class="treewrap">
  <div class="tree" id="tree"></div>
</div>

<script src="skills-data.js"></script>
<script>
  const DOMAIN_CLS = {"col-fe":"fe", "col-be":"be", "col-ai":"ai"};

  // 細項技術小標籤（各自有獨立文件頁 + 檢核表）
  function variantsHtml(skill){
    if (!skill.children || !skill.children.length) return "";
    const chips = skill.children.map(c => `
      <a class="chip" href="detail.html?id=${c.id}" title="${c.name}（檢核表）">
        ${window.SKILL_ICON(c, 18)}<span>${c.name}</span>
      </a>`).join("");
    return `<div class="variants">${chips}</div>`;
  }

  // 一個技能節點：卡片 + 其延伸技能（遞迴往下）
  function renderTech(skill, dcls, childrenMap){
    const dependents = (childrenMap[skill.id] || []);
    const sub = dependents.length
      ? `<ul>${dependents.map(d => renderTech(d, dcls, childrenMap)).join("")}</ul>`
      : "";
    return `
      <li>
        <div class="card lv-${skill.level}">
          <span class="lvdot"></span>
          <a class="card-head" href="detail.html?id=${skill.id}">
            ${window.SKILL_ICON(skill, 28)}
            <span class="nm">${skill.name}</span><span class="arrow">›</span>
          </a>
          ${variantsHtml(skill)}
        </div>
        ${sub}
      </li>`;
  }

  // 一個領域：找出根技能（parent=null），各自往下展開延伸鏈
  function renderDomain(col){
    const dcls = DOMAIN_CLS[col.cls];
    // 建立 parent -> [children skills] 對照
    const byId = {};
    col.skills.forEach(s => byId[s.id] = s);
    const childrenMap = {};
    col.skills.forEach(s => {
      const p = window.SKILL_PARENT[s.id] || null;
      if (p && byId[p]) (childrenMap[p] = childrenMap[p] || []).push(s);
    });
    const roots = col.skills.filter(s => !window.SKILL_PARENT[s.id]);
    const rootsHtml = roots.map(s => renderTech(s, dcls, childrenMap)).join("");
    return `
      <li class="${dcls}">
        <span class="pill domain ${dcls}">${col.title}</span>
        <ul>${rootsHtml}</ul>
      </li>`;
  }

  const domains = Object.values(window.SKILL_DATA).map(renderDomain).join("");
  document.getElementById("tree").innerHTML = `
    <ul>
      <li>
        <span class="pill root">🌳 全端工程師</span>
        <ul>${domains}</ul>
      </li>
    </ul>`;
</script>
</body>
</html>
